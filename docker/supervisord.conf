[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:app]
command=granian app.asgi:application --interface asginl --host 0.0.0.0 --port %(ENV_APP_PORT)s --workers 1 --runtime-threads 2 --no-ws --workers-kill-timeout 15 --workers-max-rss 512 --rss-samples 3
directory=%(ENV_HOME)s
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mailer]
command=python manage.py runmailer
directory=%(ENV_HOME)s
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=3
stopwaitsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=python manage.py runscheduler
directory=%(ENV_HOME)s
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=3
stopwaitsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[eventlistener:exit-on-fatal]
command=sh -c 'while true; do echo READY; read line; kill -SIGTERM "$(cat /tmp/supervisord.pid)"; done'
events=PROCESS_STATE_FATAL
buffer_size=16
