# 90 days. Prunes database history; the R2 lifecycle rule on the db/ prefix must be at
# least as long. See docker/AGENTS.md "Backup Retention".
snapshot:
  retention: 2160h

# These fire on wall-clock timers regardless of write volume, and every tick costs an
# R2 Class A operation; the upstream defaults (30s, 15s) are far more aggressive than
# this backup needs.
levels:
  - interval: 30m
  - interval: 6h
  - interval: 24h

l0-retention-check-interval: 30m

dbs:
  - path: /data/db.sqlite3
    replica:
      type: s3
      bucket: ${LITESTREAM_S3_BUCKET}
      path: db
      endpoint: ${LITESTREAM_S3_ENDPOINT}
      # R2 has no meaningful regions, but the S3 request signer requires a value.
      region: auto
      access-key-id: ${LITESTREAM_S3_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_S3_SECRET_ACCESS_KEY}
      sync-interval: 5m
