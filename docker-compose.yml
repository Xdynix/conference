# Expects an existing nginx-proxy (nginx-proxy/nginx-proxy) network on the host.
# The nginx sidecar joins it so nginx-proxy can discover the service via
# VIRTUAL_HOST env var. To test without nginx-proxy:
#
#   docker network create nginx-proxy
#
# Before first run, ensure the host data directory is owned by the
# container's non-root user (UID 900 by default):
#
#   mkdir -p var/media && chown -R 900:900 var

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  app:
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8000}
    env_file: .env
    logging: *default-logging
    environment:
      # Override VIRTUAL_HOST from .env so nginx-proxy does not try to route
      # traffic directly to the app container (only the nginx sidecar should
      # be discovered). This does not affect ALLOWED_HOSTS, which is resolved
      # from the Compose-level variable before the container starts.
      VIRTUAL_HOST: ""
      # Derived from VIRTUAL_HOST/VIRTUAL_PATH; localhost is needed for the
      # Docker health check which hits granian directly.
      ALLOWED_HOSTS: "localhost,${VIRTUAL_HOST:-}"
      FORCE_SCRIPT_NAME: ${VIRTUAL_PATH:-}
      # Must match the hard-coded nginx sidecar internal location.
      FILE_DOWNLOAD_MODE: nginx
      FILE_DOWNLOAD_NGINX_INTERNAL_PREFIX: /internal-media
      # 1 = sidecar nginx (appends to X-Forwarded-For); increase if another proxy is added.
      REVERSE_PROXY_COUNT: ${REVERSE_PROXY_COUNT:-1}
      # Must match the volume mount target below.
      DATA_DIR: /data
    volumes:
      - ${HOST_DATA_DIR:-./var}:/data
    deploy:
      resources:
        limits:
          memory: 1024m
    stop_grace_period: 35s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    logging: *default-logging
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:-}
      # Uncomment for subpath deployments (no trailing slash, e.g. /app).
      # nginx-proxy generates an invalid config from an empty VIRTUAL_PATH.
      # VIRTUAL_PATH: ${VIRTUAL_PATH}
      SUBPATH: ${VIRTUAL_PATH:-}
      APP_PORT: ${APP_PORT:-8000}
    depends_on:
      app:
        condition: service_healthy
        # The upstream block resolves app's IP once at startup; without this,
        # recreating app leaves nginx proxying to a dead address.
        restart: true
    volumes:
      - ./docker/10-normalize-subpath.sh:/docker-entrypoint.d/10-normalize-subpath.sh:ro
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${HOST_DATA_DIR:-./var}/media:/media:ro
    healthcheck:
      # localhost resolves to ::1 first here, and this server block is IPv4-only.
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_ping" ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m
    restart: unless-stopped
    networks:
      - default
      - nginx-proxy

  litestream:
    image: litestream/litestream:0.5
    profiles: [ "backup" ]
    user: "${APP_UID:-900}"
    logging: *default-logging
    volumes:
      - ${HOST_DATA_DIR:-./var}:/data
      - ./docker/litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_S3_BUCKET: ${BACKUP_S3_BUCKET}
      LITESTREAM_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      LITESTREAM_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      LITESTREAM_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
    command: [ "replicate" ]
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
    restart: unless-stopped

  rclone:
    image: rclone/rclone:1
    profiles: [ "backup" ]
    user: "${APP_UID:-900}"
    logging: *default-logging
    volumes:
      - ${HOST_DATA_DIR:-./var}/media:/media:ro
    environment:
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: Cloudflare
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      RCLONE_CONFIG_BACKUP_REGION: auto
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_BACKUP_ACL: private
      # Skips a per-run existence check, so the API token needs no bucket scope.
      RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET: "true"
      BACKUP_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_MEDIA_INTERVAL: ${BACKUP_MEDIA_INTERVAL:-21600}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        while true; do
          rclone sync /media backup:$$BACKUP_BUCKET/media --log-level INFO
          sleep $$BACKUP_MEDIA_INTERVAL
        done
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

networks:
  nginx-proxy:
    external: true
