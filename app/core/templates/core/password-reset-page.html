<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Password Reset</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</head>
<body>

<form id="password-reset-form">
  {% csrf_token %}

  <div>
    <label for="new-password">New Password</label>
    <input
      id="new-password"
      name="new-password"
      type="password"
      autocomplete="new-password"
      required
    >
    {{ password_validators_help_text_html | safe }}
    <div
      id="new-password-message"
      style="color: red"
      role="alert"
      aria-live="polite"
    ></div>
  </div>

  <div>
    <label for="confirm-new-password">Confirm New Password</label>
    <input
      id="confirm-new-password"
      name="confirm-new-password"
      type="password"
      autocomplete="new-password"
      required
    >
    <ul>
      <li>Please confirm your new password by re-entering it.</li>
    </ul>
    <div
      id="confirm-new-password-message"
      style="color: red"
      role="alert"
      aria-live="polite"
    ></div>
  </div>

  {% if cf_turnstile_site_key %}
    <div
      class="cf-turnstile"
      data-sitekey="{{ cf_turnstile_site_key }}"
      data-callback="onTurnstileSuccess"
      data-action="password-reset"
    >
    </div>
  {% else %}
    <p style="color: red;">⚠️ Turnstile is not configured.</p>
  {% endif %}

  <button type="submit">Submit</button>
  <div id="result-message" role="status" aria-live="polite"></div>
</form>

<script>
  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
  const resultMessage = document.getElementById("result-message");
  const newPasswordMessage = document.getElementById("new-password-message");
  const confirmNewPasswordMessage = document.getElementById("confirm-new-password-message");
  let cfTurnstileResponse = "";
  let userId = "";
  let token = "";

  const fragment = window.location.hash.substring(1);
  if (fragment) {
    const colonIndex = fragment.indexOf(":");
    if (colonIndex !== -1) {
      userId = fragment.substring(0, colonIndex);
      token = fragment.substring(colonIndex + 1);
    }
    history.replaceState(null, "", window.location.pathname + window.location.search);
  }

  function onTurnstileSuccess(response) {
    cfTurnstileResponse = response;
  }

  document.querySelector("#password-reset-form").addEventListener("submit", async event => {
    event.preventDefault();

    resultMessage.textContent = "";
    newPasswordMessage.textContent = "";
    confirmNewPasswordMessage.textContent = "";

    if (!cfTurnstileResponse) {
      resultMessage.textContent = "Please complete the challenge first.";
      return;
    }

    const newPassword = document.getElementById("new-password").value;
    const confirmNewPassword = document.getElementById("confirm-new-password").value;
    if (newPassword !== confirmNewPassword) {
      confirmNewPasswordMessage.textContent = "Passwords do not match. Please re-enter your new password.";
      return;
    }

    try {
      const response = await fetch("{% url "api-1.0.0:consume-password-reset" %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "{{ csrf_header_name|escapejs }}": csrfToken,
          "{{ cf_turnstile_response_header_name|escapejs }}": cfTurnstileResponse,
        },
        body: JSON.stringify({
          user_id: userId,
          token: token,
          new_password: newPassword,
        }),
      });

      if (response.status === 200) {
        resultMessage.textContent = "✅ Success!";
      } else if (response.status === 422) {
        const data = await response.json();
        resultMessage.textContent = `❌ Failed! ${data.message}`;

        const newPasswordErrors = (data.details || [])
          .filter(item => item.loc[item.loc.length - 1] === "new_password")
          .map(item => item.msg);
        if (newPasswordErrors.length > 0) {
          const ul = document.createElement("ul");
          newPasswordErrors.forEach(msg => {
            const li = document.createElement("li");
            li.textContent = msg
            ul.appendChild(li);
          })
          newPasswordMessage.appendChild(ul);
        }
      } else {
        console.error("Unexpected status code:", response.status, await response.text());
        resultMessage.textContent = "An unexpected error occurred. Please try again.";
      }
    } catch (error) {
      console.error("Error during fetch:", error);
      resultMessage.textContent = "An unexpected error occurred. Please try again.";
    } finally {
      turnstile.reset();
      cfTurnstileResponse = "";
    }
  });
</script>

</body>
</html>
