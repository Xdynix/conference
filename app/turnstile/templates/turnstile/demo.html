<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="dark light">
  <title>Turnstile Demo</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</head>
<body>

<form id="turnstile-form" novalidate>
  {% csrf_token %}

  {% if cf_turnstile_site_key %}
    <div
      class="cf-turnstile"
      data-sitekey="{{ cf_turnstile_site_key }}"
      data-callback="onTurnstileSuccess"
      data-action="{{ cf_turnstile_action }}"
    >
    </div>
  {% else %}
    <p style="color: red;">⚠️ Turnstile is not configured.</p>
  {% endif %}

  <button type="submit">Submit</button>
  <div id="result-message" role="status" aria-live="polite"></div>
</form>

<script>
  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
  const resultMessage = document.getElementById("result-message");
  let cfTurnstileResponse = "";

  function onTurnstileSuccess(response) {
    cfTurnstileResponse = response;
  }

  document.querySelector("#turnstile-form").addEventListener("submit", async event => {
    event.preventDefault();

    resultMessage.textContent = "";

    if (!cfTurnstileResponse) {
      resultMessage.textContent = "Please complete the challenge first.";
      return;
    }

    try {
      const response = await fetch("{% url "turnstile:demo-api" %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "{{ csrf_header_name|escapejs }}": csrfToken,
          "{{ cf_turnstile_response_header_name|escapejs }}": cfTurnstileResponse,
        },
      });

      if (response.status === 200) {
        resultMessage.textContent = "✅ Success!";
      } else if (response.status === 403) {
        resultMessage.textContent = "❌ Failed!";
      } else {
        console.error("Unexpected status code:", response.status, await response.text());
        resultMessage.textContent = "An unexpected error occurred. Please try again.";
      }
    } catch (error) {
      console.error("Error during fetch:", error);
      resultMessage.textContent = "An unexpected error occurred. Please try again.";
    } finally {
      turnstile.reset();
      cfTurnstileResponse = "";
    }
  });
</script>

</body>
</html>
