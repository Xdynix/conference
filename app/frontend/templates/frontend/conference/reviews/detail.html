{% extends "frontend/layouts/app.html" %}

{% block title %}Review - {% endblock %}

{% block content %}
  <div x-data="reviewDetail()" x-init="
    $store.sidebar.setActive('my-reviews');
    $store.breadcrumb.set([
      {label: 'My Reviews', url: '{% url 'frontend:review-list' conference_name=params.conference_name %}'},
      {label: 'Review'}
    ]);
  ">
    <template x-if="$store.conference.loading">
      <div class="text-center py-5">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </template>

    <template x-if="!$store.conference.loading && !$store.conference.detail">
      <div class="text-center py-5">
        <p class="text-muted mb-0">Conference not found.</p>
      </div>
    </template>

    <template x-if="!$store.conference.loading && $store.conference.detail">
      <div>
        <div x-show="loading" class="text-center py-5">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div x-show="!loading && error" x-cloak class="text-center py-5">
          <p class="text-muted mb-0">Review not found.</p>
        </div>

        <div x-show="!loading && !error && review" x-cloak>
          <div class="row justify-content-center">
            <div class="col-xl-8 col-xxl-6">
              <h1 class="h3 mb-4 d-flex align-items-center">
                <span x-text="headerText">Review</span>
                <span class="badge ms-2 fs-6" :class="stateBadge.class" x-text="stateBadge.label"></span>
              </h1>
              {# Paper info card #}
              <div class="card mb-4">
                <div class="card-body">
                  <span class="font-monospace text-muted" x-text="review?.paper.code"></span>
                  <h5 class="card-title mt-2 mb-2" x-text="review?.paper.title"></h5>
                  <template x-if="review?.paper.keywords?.length">
                    <div class="mb-2">
                      <template x-for="kw in review.paper.keywords" :key="kw">
                        <span class="badge bg-body-tertiary text-body border me-1" x-text="kw"></span>
                      </template>
                    </div>
                  </template>
                  <p class="text-muted small mb-0">
                    <span x-text="review?.paper.track?.display_name"></span>
                    <template x-if="review?.paper.submission">
                      <span>
                        <span class="mx-1">·</span>
                        <a :href="review.paper.submission.download_url" class="text-decoration-none" target="_blank">
                          <i class="bi-file-earmark-text me-1"></i>Download Paper
                        </a>
                      </span>
                    </template>
                  </p>
                  <template x-if="review?.paper.abstract">
                    <div class="mt-3 pt-3 border-top">
                      <button
                        type="button"
                        class="btn btn-link btn-sm p-0 small text-decoration-none"
                        @click="showAbstract = !showAbstract"
                      >
                        <i class="bi" :class="showAbstract ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                        Abstract
                      </button>
                      <p
                        x-show="showAbstract"
                        x-cloak
                        class="small mt-2 mb-0"
                        style="white-space: pre-wrap;"
                        x-text="review.paper.abstract"
                      ></p>
                    </div>
                  </template>
                </div>
              </div>

              {# State: Pending #}
              <template x-if="review?.state === APP.enums.ReviewState.PENDING.value">
                <div>
                  <div class="d-flex justify-content-end gap-2">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      @click="declineReview()"
                      :disabled="accepting || declining"
                    >
                      <span x-show="declining" class="spinner-border spinner-border-sm me-1"></span>
                      Decline
                    </button>
                    <button
                      type="button"
                      class="btn btn-primary"
                      @click="acceptReview()"
                      :disabled="accepting || declining"
                    >
                      <span x-show="accepting" class="spinner-border spinner-border-sm me-1"></span>
                      Accept Assignment
                    </button>
                  </div>
                </div>
              </template>

              {# State: Accepted (In Progress) #}
              <template x-if="review?.state === APP.enums.ReviewState.ACCEPTED.value">
                <div>
                  {# Submit confirmation modal #}
                  <div class="modal fade" id="submit-review-modal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                      <div class="modal-content">
                        <div class="modal-header">
                          <h5 class="modal-title">Submit Review</h5>
                          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                          <p>Are you sure you want to submit this review?</p>
                          <p class="mb-0 small text-muted">
                            After submission, you will not be able to make changes.
                          </p>
                        </div>
                        <div class="modal-footer">
                          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                          </button>
                          <button type="button" class="btn btn-success" @click="submitReview()" :disabled="submitting">
                            <span x-show="submitting" class="spinner-border spinner-border-sm me-1"></span>
                            Submit
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <form x-ref="reviewForm" @submit.prevent>
                    <div class="mb-4">
                      <h6 class="mb-3">Scores</h6>
                      <div class="table-responsive">
                        <table class="table table-striped table-sm align-middle mb-0">
                          <thead>
                          <tr>
                            <th></th>
                            <template x-for="i in 5" :key="i">
                              <th class="text-center small text-muted" style="width: 6rem;">
                                <div x-text="i"></div>
                                <div x-text="CRITERIA_LABELS[i]" class="fw-normal"></div>
                              </th>
                            </template>
                          </tr>
                          </thead>
                          <tbody>
                          <template x-for="score in criteriaScores" :key="score.key">
                            <tr>
                              <td>
                                <span x-text="score.label"></span>
                                <span class="text-danger">*</span>
                              </td>
                              <template x-for="i in 5" :key="i">
                                <td class="text-center">
                                  <input
                                    type="radio"
                                    class="form-check-input"
                                    :name="score.key"
                                    :value="i"
                                    x-model.number="form[score.key]"
                                    required
                                  >
                                </td>
                              </template>
                            </tr>
                          </template>
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div class="mb-4">
                      <h6 class="mb-3">
                        Recommendation
                        <span class="text-danger">*</span>
                      </h6>
                      <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                          <thead>
                          <tr>
                            <template x-for="i in 5" :key="i">
                              <th class="text-center small text-muted" style="width: 6rem;">
                                <div x-text="i"></div>
                                <div x-text="RECOMMENDATION_LABELS[i]" class="fw-normal"></div>
                              </th>
                            </template>
                          </tr>
                          </thead>
                          <tbody>
                          <tr>
                            <template x-for="i in 5" :key="i">
                              <td class="text-center">
                                <input
                                  type="radio"
                                  class="form-check-input"
                                  name="recommendation"
                                  :value="i"
                                  x-model.number="form.recommendation"
                                  required
                                >
                              </td>
                            </template>
                          </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <hr>

                    <div class="mb-4">
                      <label for="contribution" class="form-label">
                        Contribution Summary
                        <span class="text-danger">*</span>
                        <span class="small text-muted fw-normal">
                          — Visible to authors anonymously
                        </span>
                      </label>
                      <textarea
                        id="contribution"
                        class="form-control"
                        :class="{ 'is-invalid': errors.contribution }"
                        rows="4"
                        x-model="form.contribution"
                        required
                      ></textarea>
                      <div class="invalid-feedback" x-text="errors.contribution"></div>
                    </div>

                    <div class="mb-4">
                      <label for="decision-reason" class="form-label">
                        Decision Reason
                        <span class="text-danger">*</span>
                        <span class="small text-muted fw-normal">
                          — Visible to authors anonymously
                        </span>
                      </label>
                      <textarea
                        id="decision-reason"
                        class="form-control"
                        :class="{ 'is-invalid': errors.decision_reason }"
                        rows="4"
                        x-model="form.decision_reason"
                        required
                      ></textarea>
                      <div class="invalid-feedback" x-text="errors.decision_reason"></div>
                    </div>

                    <div class="mb-4">
                      <label for="comments" class="form-label">
                        Comments for Authors
                        <span class="small text-muted fw-normal">
                          — Visible to authors anonymously
                        </span>
                      </label>
                      <textarea
                        id="comments"
                        class="form-control"
                        :class="{ 'is-invalid': errors.comments }"
                        rows="3"
                        x-model="form.comments"
                      ></textarea>
                      <div class="invalid-feedback" x-text="errors.comments"></div>
                    </div>

                    <div class="mb-4">
                      <label for="confidential-remarks" class="form-label">
                        Confidential Remarks
                        <span class="small text-muted fw-normal">
                          — Visible to editors only
                        </span>
                      </label>
                      <textarea
                        id="confidential-remarks"
                        class="form-control"
                        :class="{ 'is-invalid': errors.confidential_remarks }"
                        rows="3"
                        x-model="form.confidential_remarks"
                      ></textarea>
                      <div class="invalid-feedback" x-text="errors.confidential_remarks"></div>
                    </div>

                    <hr>

                    <div
                      x-show="errors._form"
                      x-cloak
                      class="alert alert-danger small mb-3"
                      x-text="errors._form"
                    ></div>

                    <div class="d-flex justify-content-between align-items-center">
                      <button type="button" class="btn btn-outline-primary" @click="saveDraft()" :disabled="saving">
                        <span x-show="saving" class="spinner-border spinner-border-sm me-1"></span>
                        Save Draft
                      </button>
                      <template x-if="!isDirty">
                        <button
                          type="button"
                          class="btn btn-success"
                          @click="
                            if ($refs.reviewForm.reportValidity()) {
                              new bootstrap.Modal(document.getElementById('submit-review-modal')).show();
                            }
                          "
                        >
                          Submit Review
                        </button>
                      </template>
                      <template x-if="isDirty">
                        <span class="text-muted small">
                          Save changes before submitting
                        </span>
                      </template>
                    </div>
                  </form>
                </div>
              </template>

              {# State: Submitted #}
              <template x-if="review?.state === APP.enums.ReviewState.SUBMITTED.value">
                <div>
                  <p class="text-muted small mb-4">
                    Submitted on <span x-text="formatDate(review.submit_time)"></span>
                  </p>

                  <div class="mb-4" style="max-width: 24rem;">
                    <h6 class="text-muted mb-3">Scores</h6>
                    <table class="table table-striped table-sm mb-0 w-100">
                      <tbody>
                      <template x-for="score in criteriaScores" :key="score.key">
                        <tr>
                          <td x-text="score.label"></td>
                          <td class="text-end" x-text="formatCriteriaScore(review[score.key])"></td>
                        </tr>
                      </template>
                      <tr class="table-group-divider">
                        <td class="fw-medium">Recommendation</td>
                        <td class="text-end fw-medium" x-text="formatRecommendation(review.recommendation)"></td>
                      </tr>
                      </tbody>
                    </table>
                  </div>

                  <hr>

                  <div class="mb-4">
                    <div class="d-flex align-items-baseline gap-2 mb-2">
                      <h6 class="text-muted mb-0">Contribution Summary</h6>
                      <span class="small text-muted">
                        — Visible to authors anonymously
                      </span>
                    </div>
                    <p class="mb-0" style="white-space: pre-wrap;" x-text="review.contribution"></p>
                  </div>

                  <div class="mb-4">
                    <div class="d-flex align-items-baseline gap-2 mb-2">
                      <h6 class="text-muted mb-0">Decision Reason</h6>
                      <span class="small text-muted">
                        — Visible to authors anonymously
                      </span>
                    </div>
                    <p class="mb-0" style="white-space: pre-wrap;" x-text="review.decision_reason"></p>
                  </div>

                  <template x-if="review.comments">
                    <div class="mb-4">
                      <div class="d-flex align-items-baseline gap-2 mb-2">
                        <h6 class="text-muted mb-0">Comments for Authors</h6>
                        <span class="small text-muted">
                          — Visible to authors anonymously
                        </span>
                      </div>
                      <p class="mb-0" style="white-space: pre-wrap;" x-text="review.comments"></p>
                    </div>
                  </template>

                  <template x-if="review.confidential_remarks">
                    <div class="mb-4">
                      <div class="d-flex align-items-baseline gap-2 mb-2">
                        <h6 class="text-muted mb-0">Confidential Remarks</h6>
                        <span class="small text-muted">
                          — Visible to editors only
                        </span>
                      </div>
                      <p class="mb-0" style="white-space: pre-wrap;" x-text="review.confidential_remarks"></p>
                    </div>
                  </template>
                </div>
              </template>

              {# State: Declined #}
              <template x-if="review?.state === APP.enums.ReviewState.DECLINED.value">
                <div class="text-muted">
                  <p>You declined this review assignment.</p>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
{% endblock %}

{% block scripts %}
  {{ block.super }}
  <script>
    const CRITERIA_LABELS = {
      1: 'Poor',
      2: 'Fair',
      3: 'Good',
      4: 'Very Good',
      5: 'Outstanding'
    };
    const RECOMMENDATION_LABELS = {
      1: 'Strongly Reject',
      2: 'Reject',
      3: 'Marginally Accept',
      4: 'Accept',
      5: 'Strong Accept'
    };

    function reviewDetail() {
      return {
        review: null,
        loading: true,
        error: null,
        showAbstract: false,
        accepting: false,
        declining: false,
        saving: false,
        submitting: false,
        isDirty: false,
        errors: {},
        form: {
          originality: null,
          significance: null,
          technical: null,
          reference: null,
          presentation: null,
          match_topic: null,
          recommendation: null,
          contribution: '',
          decision_reason: '',
          comments: '',
          confidential_remarks: '',
        },

        criteriaScores: [
          {key: 'originality', label: 'Originality'},
          {key: 'significance', label: 'Significance'},
          {key: 'technical', label: 'Technical Quality'},
          {key: 'reference', label: 'References'},
          {key: 'presentation', label: 'Presentation'},
          {key: 'match_topic', label: 'Topic Match'},
        ],

        get headerText() {
          if (!this.review) return 'Review';
          return `Review: ${this.review.paper.code}`;
        },

        get stateBadge() {
          if (!this.review) return {class: '', label: ''};
          return reviewStateBadge(this.review.state);
        },

        formatDate(isoString) {
          if (!isoString) return '';
          return new Intl.DateTimeFormat('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
          }).format(new Date(isoString));
        },

        formatCriteriaScore(value) {
          if (!value) return '—';
          return `${CRITERIA_LABELS[value]} (${value})`;
        },

        formatRecommendation(value) {
          if (!value) return '—';
          return `${RECOMMENDATION_LABELS[value]} (${value})`;
        },

        async init() {
          try {
            const url = "{% url 'api-1.0.0:get-my-review' conference_name=params.conference_name review_uid=params.review_uid %}";
            const {data} = await api.get(url);
            this.review = data;
            this.populateForm();
            this.$nextTick(() => {
              this.isDirty = false;
              this.$watch('form', () => {
                this.isDirty = true;
              }, {deep: true});
            });
            this.$store.breadcrumb.set([
              {
                label: 'My Reviews',
                url: '{% url 'frontend:review-list' conference_name=params.conference_name %}'
              },
              {label: data.paper.code}
            ]);
          } catch (e) {
            this.error = e;
          } finally {
            this.loading = false;
          }
        },

        populateForm() {
          const r = this.review;
          if (!r) return;
          this.form.originality = r.originality;
          this.form.significance = r.significance;
          this.form.technical = r.technical;
          this.form.reference = r.reference;
          this.form.presentation = r.presentation;
          this.form.match_topic = r.match_topic;
          this.form.recommendation = r.recommendation;
          this.form.contribution = r.contribution || '';
          this.form.decision_reason = r.decision_reason || '';
          this.form.comments = r.comments || '';
          this.form.confidential_remarks = r.confidential_remarks || '';
        },

        async acceptReview() {
          if (this.accepting) return;
          this.accepting = true;
          try {
            const url = "{% url 'api-1.0.0:accept-review' conference_name=params.conference_name review_uid=params.review_uid %}";
            const {data} = await api.post(url);
            this.review = data;
          } finally {
            this.accepting = false;
          }
        },

        async declineReview() {
          if (this.declining) return;
          if (!confirm('Decline this review assignment?')) return;
          this.declining = true;
          try {
            const url = "{% url 'api-1.0.0:decline-review' conference_name=params.conference_name review_uid=params.review_uid %}";
            const {data} = await api.post(url);
            this.review = data;
          } finally {
            this.declining = false;
          }
        },

        async saveDraft() {
          if (this.saving) return;
          this.errors = {};
          this.saving = true;

          try {
            const url = "{% url 'api-1.0.0:update-my-review' conference_name=params.conference_name review_uid=params.review_uid %}";
            const {data} = await api.patch(url, this.form);
            this.review = data;
            this.populateForm();
            this.$nextTick(() => {
              this.isDirty = false;
            });
          } catch (error) {
            const resp = error.response?.data;
            if (error.response?.status === 422 && resp?.details?.length) {
              this.errors = mapErrors(resp.details);
            } else {
              this.errors._form = resp?.message || 'Failed to save draft.';
            }
          } finally {
            this.saving = false;
          }
        },

        async submitReview() {
          if (this.submitting) return;
          this.submitting = true;
          this.errors = {};

          try {
            const url = "{% url 'api-1.0.0:submit-my-review' conference_name=params.conference_name review_uid=params.review_uid %}";
            const {data} = await api.post(url);
            this.review = data;
          } catch (error) {
            const resp = error.response?.data;
            this.errors._form = resp?.message || 'Failed to submit review.';
          } finally {
            this.submitting = false;
            bootstrap.Modal.getInstance(document.getElementById('submit-review-modal'))?.hide();
          }
        },
      };
    }
  </script>
{% endblock %}
