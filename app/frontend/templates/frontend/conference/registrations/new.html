{% extends "frontend/layouts/app.html" %}

{% block title %}Register | {% endblock %}

{% block content %}
  <div
    x-data="registrationNew()"
    x-init="
      $store.sidebar.setActive('my-registrations');
      $store.breadcrumb.set([
        {label: 'My Registrations', url: '{% url 'frontend:registration-list' conference_name=params.conference_name %}'},
        {label: 'Register'}
      ]);
    "
  >
    <div x-show="$store.conference.loading || loading" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div x-show="!$store.conference.loading && !$store.conference.detail" x-cloak class="text-center py-5">
      <p class="text-muted mb-0">Conference not found.</p>
    </div>

    <div x-show="$store.conference.detail && !loading && error" x-cloak class="text-center py-5">
      <p class="text-muted mb-0">Failed to load registration options.</p>
    </div>

    <div x-show="$store.conference.detail && !loading && !error" x-cloak>
      <div class="row justify-content-center">
        <div class="col-xl-8 col-xxl-6">
          <h1 class="h3 mb-4">Register</h1>

          <template x-if="attendanceTypes.length === 0">
            <p class="text-muted">Registration is not available at this time.</p>
          </template>

          <template x-if="attendanceTypes.length > 0">
            <div>
              {# TODO: Registration form #}
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ block.super }}
  <script>
    function registrationNew() {
      return {
        attendanceTypes: [],
        loading: true,
        error: null,

        async init() {
          try {
            const url = "{% url 'api-1.0.0:list-attendance-types' params.conference_name %}";
            const {data} = await api.get(url);
            this.attendanceTypes = data;
          } catch (e) {
            this.error = e;
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
{% endblock %}
