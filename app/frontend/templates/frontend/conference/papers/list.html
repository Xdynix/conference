{% extends "frontend/layouts/app.html" %}

{% block title %}My Papers - {% endblock %}

{% block content %}
  <div x-data="paperList()" x-init="
    $store.sidebar.setActive('my-papers');
    $store.breadcrumb.set([{label: 'My Papers'}]);
  ">
    <h1 class="h3 mb-4">My Papers</h1>

    <template x-if="$store.conference.loading || loading">
      <div class="text-center py-5">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </template>

    <template x-if="!$store.conference.loading && !$store.conference.detail">
      <div class="text-center py-5">
        <p class="text-muted mb-0">Conference not found.</p>
      </div>
    </template>

    <template x-if="$store.conference.detail && !loading && error">
      <div class="text-center py-5">
        <p class="text-muted mb-0">Failed to load papers.</p>
      </div>
    </template>

    <template
      x-if="$store.conference.detail && !loading && !error && papers.length === 0"
    >
      <p class="text-muted">No papers yet.</p>
    </template>

    <template
      x-if="$store.conference.detail && !loading && !error && papers.length > 0"
    >
      <div>
        {# TODO: Implement paper list with cards layout #}
        <pre x-text="JSON.stringify(papers, null, 2)"></pre>
      </div>
    </template>
  </div>
{% endblock %}

{% block scripts %}
  {{ block.super }}
  <script>
    function paperList() {
      return {
        papers: [],
        loading: true,
        error: null,

        async init() {
          try {
            const url = APP.urls.myPapers.list(APP.params.conference_name);
            const {data} = await api.get(url);
            this.papers = data.items;
          } catch (e) {
            this.error = e;
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
{% endblock %}
