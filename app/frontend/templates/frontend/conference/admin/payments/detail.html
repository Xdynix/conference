{% extends "frontend/layouts/app.html" %}

{% block title %}Admin: Payment | {% endblock %}

{% block content %}
  <div
    x-data="adminPaymentDetail()"
    x-init="
      $store.sidebar.setActive('admin-payments');
      $store.breadcrumb.set([
        {label: 'Payments', url: '{% url 'frontend:admin-payment-list' conference_name=params.conference_name %}'},
        {label: 'Payment'}
      ]);
    "
  >
    <div x-show="$store.conference.loading || loading" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div x-show="!$store.conference.loading && !$store.conference.detail" x-cloak class="text-center py-5">
      <p class="mb-0">Conference not found.</p>
    </div>

    <div x-show="$store.conference.detail && !loading && error" x-cloak class="text-center py-5">
      <p class="mb-0">Payment not found.</p>
    </div>

    <div x-show="$store.conference.detail && !loading && !error && payment" x-cloak>
      <div class="row justify-content-center">
        <div class="content-panel col-xl-8 col-xxl-6">
          <h1 class="h3 mb-4">
            <span x-text="'Payment: ' + (payment?.reference || '...' + payment?.uid?.slice(-12))"></span>
          </h1>

          <form @submit.prevent="save()">
            {% include "frontend/components/payment/form.html" %}

            <div
              x-show="errors._form"
              x-cloak
              class="alert alert-danger small mt-3"
              x-text="errors._form"
            ></div>

            <div class="d-flex justify-content-between align-items-center mt-4">
              <button
                type="button"
                class="btn btn-outline-danger"
                @click="confirmDelete()"
                :disabled="deleting"
              >
                <span x-show="deleting" class="spinner-border spinner-border-sm me-1"></span>
                Delete
              </button>
              <button type="submit" class="btn btn-primary" :disabled="saving">
                <span x-show="saving" class="spinner-border spinner-border-sm me-1"></span>
                <span x-text="saved ? 'Saved!' : 'Save'"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ block.super }}
  <script>
    function adminPaymentDetail() {
      return {
        ...paymentItems(),

        payment: null,
        allRegistrations: [],
        form: {
          amount: '',
          currency: '',
          type: '',
          method: '',
          reference: '',
          note: '',
          items: [],
        },
        errors: {},
        loading: true,
        error: null,
        saving: false,
        saved: false,
        deleting: false,

        populateForm() {
          const p = this.payment;
          if (!p) return;
          this.form.amount = p.amount;
          this.form.currency = p.currency;
          this.form.type = p.type;
          this.form.method = p.method;
          this.form.reference = p.reference;
          this.form.note = p.note;
          this.form.items = p.items.map(item => ({
            _key: crypto.randomUUID(),
            registration: item.registration.uid,
            description: item.description,
            amount: item.amount,
          }));
        },

        async init() {
          try {
            const [paymentRes, registrationsRes] = await Promise.all([
              api.get("{% url 'api-1.0.0:get-payment' conference_name=params.conference_name payment_uid=params.payment_uid %}"),
              api.get("{% url 'api-1.0.0:list-registrations' params.conference_name %}", {params: {page_size: 1000}}),
            ]);

            this.payment = paymentRes.data;
            this.allRegistrations = registrationsRes.data.items;
            this.populateForm();

            const ref = this.payment.reference || '...' + this.payment.uid.slice(-12);
            document.title = document.title.replace('Payment | ', `Payment - ${ref} | `);
            this.$store.breadcrumb.set([
              {
                label: 'Payments',
                url: '{% url 'frontend:admin-payment-list' conference_name=params.conference_name %}',
              },
              {label: ref}
            ]);
          } catch (e) {
            this.error = e;
          } finally {
            this.loading = false;
          }
        },

        async confirmDelete() {
          if (!confirm('Are you sure you want to delete this payment?')) return;
          if (this.deleting) return;
          this.deleting = true;

          try {
            const apiUrl = "{% url 'api-1.0.0:delete-payment' conference_name=params.conference_name payment_uid=params.payment_uid %}";
            await api.delete(apiUrl);
            window.location.href = '{% url 'frontend:admin-payment-list' conference_name=params.conference_name %}';
          } catch (error) {
            const resp = error.response?.data;
            this.errors._form = resp?.message || 'Failed to delete payment.';
          } finally {
            this.deleting = false;
          }
        },

        async save() {
          if (this.saving) return;
          this.errors = {};
          this.saving = true;

          try {
            const apiUrl = "{% url 'api-1.0.0:update-payment' conference_name=params.conference_name payment_uid=params.payment_uid %}";
            const {data} = await api.patch(apiUrl, this.form);
            this.payment = data;
            this.populateForm();
            this.saved = true;
            setTimeout(() => this.saved = false, 2000);
          } catch (error) {
            const resp = error.response?.data;
            if (error.response?.status === 422 && resp?.details?.length) {
              this.errors = mapErrors(resp.details);
            } else if (error.response?.status === 409) {
              this.errors._form = resp?.message || 'A payment with this reference already exists.';
            } else {
              this.errors._form = resp?.message || 'Failed to save payment.';
            }
          } finally {
            this.saving = false;
          }
        },
      };
    }
  </script>
{% endblock %}
