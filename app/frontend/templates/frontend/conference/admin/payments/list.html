{% extends "frontend/layouts/app.html" %}
{% load static %}

{% block title %}Admin: Payments | {% endblock %}

{% block content %}
  <div
    class="d-flex flex-column flex-grow-1 mx-n4 mb-n4"
    style="min-height: 0;"
    x-data="adminPaymentList()"
    x-init="
      $store.sidebar.setActive('admin-payments');
      $store.breadcrumb.set([{label: 'Payments'}]);
    "
  >
    <div x-show="$store.conference.loading" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div x-show="!$store.conference.loading && !$store.conference.detail" x-cloak class="text-center py-5">
      <p class="text-muted mb-0">Conference not found.</p>
    </div>

    <template x-if="!$store.conference.loading && $store.conference.detail">
      <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        {# Header Actions #}
        <div class="d-flex justify-content-between align-items-center gap-2 pb-2 border-bottom">
          <div>
            <a
              href="{% url 'frontend:admin-payment-new' conference_name=params.conference_name %}"
              class="btn btn-sm btn-outline-primary d-flex align-items-center gap-2"
            >
              <i class="bi-plus-lg"></i>
              New Payment
            </a>
          </div>
          <div class="d-flex align-items-center gap-2">
            <template x-if="hasActiveFilters">
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2"
                @click="clearFilters()"
              >
                <i class="bi-x-lg"></i>
                Clear Filters
              </button>
            </template>
            <button
              type="button"
              class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2"
              :disabled="loading"
              @click="fetchData()"
            >
              <span x-show="loading" class="spinner-border spinner-border-sm"></span>
              <i x-show="!loading" class="bi-arrow-clockwise"></i>
              Refresh
            </button>
          </div>
        </div>

        {# Main Content #}
        <div class="d-flex flex-grow-1 overflow-hidden">
          {# Payment Table #}
          <div class="flex-grow-1 overflow-auto">
            <div x-show="loading" class="text-center py-5">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>

            <div x-show="!loading && error" x-cloak class="text-center py-5">
              <p class="text-muted mb-0">Failed to load payments.</p>
            </div>

            <table x-show="!loading && !error" x-cloak class="table table-striped table-hover">
              <thead class="bg-body" style="position: sticky; top: 0; z-index: 1;">
              <tr>
                <template x-for="col in columns" :key="col.key">
                  <th
                    :class="thClass(col)"
                    :style="thStyle(col)"
                    @click="col.sortValue && toggleSort(col.key)"
                    :role="col.sortValue ? 'button' : null"
                  >
                    <span>
                      <span x-text="col.label"></span>
                      <i :class="sortIcon(col.key)" class="ms-1"></i>
                    </span>
                  </th>
                </template>
              </tr>
              </thead>
              <tbody>
              <template x-for="p in filteredPayments" :key="p.uid">
                <tr>
                  <template x-for="col in columns" :key="col.key">
                    <td
                      :class="tdClass(col)"
                      :style="tdStyle(col)"
                    >
                      <template x-if="col.link && col.link(p)">
                        <a
                          :href="col.link(p)"
                          :class="col.linkClass?.(p)"
                          target="_blank"
                          @click.stop
                          x-text="col.value(p)"
                        ></a>
                      </template>
                      <template x-if="!(col.link && col.link(p)) && col.badge">
                        <span class="badge" :class="col.badge(p)" x-text="col.value(p)"></span>
                      </template>
                      <template x-if="!(col.link && col.link(p)) && !col.badge">
                        <span x-text="col.value(p)"></span>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
              </tbody>
            </table>
          </div>

          {# Filter Sidebar #}
          <div class="d-flex flex-column border-start bg-body-tertiary" style="width: 280px;">
            {# Search field #}
            <div class="border-bottom position-relative">
              <i class="bi-search position-absolute top-50 translate-middle-y text-muted" style="left: 0.75rem;"></i>
              <input
                type="text"
                class="form-control border-0 rounded-0 ps-5"
                placeholder="Search reference or paper..."
                x-model="urlState.search"
              >
            </div>

            {# Filter sections #}
            <div class="flex-grow-1 overflow-auto">
              {# Type filter #}
              <div class="border-bottom" x-data="{open: true}">
                <button
                  class="btn btn-link text-decoration-none text-body w-100 d-flex justify-content-between align-items-center px-3 py-2"
                  type="button"
                  @click="open = !open"
                >
                  <span class="fw-medium">Type</span>
                  <i class="small" :class="open ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                </button>
                <template x-if="open">
                  <div class="px-3 pb-3">
                    <template x-for="opt in typeOptions" :key="opt.value">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          :id="'type-' + opt.value"
                          :value="opt.value"
                          :checked="urlState.types.includes(opt.value)"
                          @change="toggleType(opt.value)"
                        >
                        <label class="form-check-label" :for="'type-' + opt.value" x-text="opt.label"></label>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              {# Method filter #}
              <div class="border-bottom" x-data="{open: true}">
                <button
                  class="btn btn-link text-decoration-none text-body w-100 d-flex justify-content-between align-items-center px-3 py-2"
                  type="button"
                  @click="open = !open"
                >
                  <span class="fw-medium">Method</span>
                  <i class="small" :class="open ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                </button>
                <template x-if="open">
                  <div class="px-3 pb-3">
                    <template x-for="opt in methodOptions" :key="opt.value">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          :id="'method-' + opt.value"
                          :value="opt.value"
                          :checked="urlState.methods.includes(opt.value)"
                          @change="toggleMethod(opt.value)"
                        >
                        <label class="form-check-label" :for="'method-' + opt.value" x-text="opt.label"></label>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>

        {# Footer #}
        <div class="d-flex justify-content-between align-items-center gap-3 pt-2 border-top">
          <span class="text-muted" x-text="footerText"></span>
        </div>
      </div>
    </template>
  </div>
{% endblock %}

{% block scripts %}
  {{ block.super }}
  <script src="{% static 'frontend/js/url-state.js' %}"></script>
  <script>
    // =============================================================================
    // URL State Schema Configuration
    // =============================================================================

    const adminPaymentListSortOptions = [
      'reference', '-reference',
      'type', '-type',
      'amount', '-amount',
      'method', '-method',
      'items', '-items',
      'created', '-created',
    ];

    const adminPaymentListTypeOptions = Object.values(APP.enums.PaymentType)
      .filter(s => s && typeof s.value === 'string')
      .map(s => s.value);

    const adminPaymentListMethodOptions = Object.values(APP.enums.PaymentMethod)
      .filter(s => s && typeof s.value === 'string')
      .map(s => s.value);

    const adminPaymentListSchema = {
      search: UrlState.types.string({default: ''}),
      sort: UrlState.types.oneOf(adminPaymentListSortOptions, {default: '-created'}),
      types: UrlState.types.setOf(
        UrlState.types.oneOf(adminPaymentListTypeOptions, {default: ''}),
        {default: [], allowEmpty: true}
      ),
      methods: UrlState.types.setOf(
        UrlState.types.oneOf(adminPaymentListMethodOptions, {default: ''}),
        {default: [], allowEmpty: true}
      ),
    };

    // =============================================================================
    // Alpine Component
    // =============================================================================

    function adminPaymentList() {
      return {
        ...UrlState.use(adminPaymentListSchema),

        // ---------------------------------------------------------------------------
        // State
        // ---------------------------------------------------------------------------

        allPayments: [],
        loading: true,
        error: null,

        // ---------------------------------------------------------------------------
        // Column Definitions
        // ---------------------------------------------------------------------------

        columns: [
          {
            key: 'reference',
            label: 'Reference',
            value: (p) => p?.reference || '...' + p?.uid?.slice(-12),
            link: (p) => p ? APP.urls.pages.adminPaymentDetail(APP.params.conference_name, p.uid) : null,
            sortValue: (p) => p?.reference || '',
            nowrap: true,
            mono: true,
            sticky: true,
            stickyBorder: true,
          },
          {
            key: 'type',
            label: 'Type',
            value: (p) => p ? paymentTypeBadge(p.type).label : '',
            sortValue: (p) => p?.type,
            badge: (p) => p ? paymentTypeBadge(p.type).class : 'text-bg-secondary',
            nowrap: true,
          },
          {
            key: 'amount',
            label: 'Amount',
            value: (p) => p?.formatted_amount || '',
            sortValue: (p) => p ? parseFloat(p.amount) : 0,
            nowrap: true,
            right: true,
          },
          {
            key: 'method',
            label: 'Method',
            value: (p) => p ? enumLabel(APP.enums.PaymentMethod, p.method) || p.method : '',
            sortValue: (p) => p?.method,
            nowrap: true,
          },
          {
            key: 'papers',
            label: 'Papers',
            value: (p) => {
              if (!p) return '';
              const codes = [...new Set(
                p.items.map(i => i.registration.paper).filter(Boolean)
              )];
              return codes.join(', ');
            },
            mono: true,
            flex: true,
            truncate: true,
          },
          {
            key: 'items',
            label: 'Items',
            value: (p) => p ? p.items.length : '',
            sortValue: (p) => p ? p.items.length : 0,
            nowrap: true,
            center: true,
          },
          {
            key: 'created',
            label: 'Created',
            value: (p) => formatDate(p?.create_time),
            sortValue: (p) => p?.create_time || '',
            nowrap: true,
          },
        ],

        // ---------------------------------------------------------------------------
        // Filter Options
        // ---------------------------------------------------------------------------

        get typeOptions() {
          return Object.values(APP.enums.PaymentType)
            .filter(s => s && typeof s.value === 'string')
            .map(s => ({value: s.value, label: s.label}));
        },

        get methodOptions() {
          return Object.values(APP.enums.PaymentMethod)
            .filter(s => s && typeof s.value === 'string')
            .map(s => ({value: s.value, label: s.label}));
        },

        // ---------------------------------------------------------------------------
        // Filter Toggle Methods
        // ---------------------------------------------------------------------------

        toggleType(type) {
          const types = this.urlState.types;
          if (types.includes(type)) {
            this.urlState.types = types.filter(t => t !== type);
          } else {
            this.urlState.types = [...types, type];
          }
        },

        toggleMethod(method) {
          const methods = this.urlState.methods;
          if (methods.includes(method)) {
            this.urlState.methods = methods.filter(m => m !== method);
          } else {
            this.urlState.methods = [...methods, method];
          }
        },

        get hasActiveFilters() {
          return this.urlState.search !== '' ||
            this.urlState.types.length > 0 ||
            this.urlState.methods.length > 0;
        },

        clearFilters() {
          this.urlState.search = '';
          this.urlState.types = [];
          this.urlState.methods = [];
        },

        // ---------------------------------------------------------------------------
        // Filtering and Sorting
        // ---------------------------------------------------------------------------

        get filteredPayments() {
          let payments = this.allPayments;

          // Text search (reference, registration reference codes, paper codes)
          const search = this.urlState.search.toLowerCase().trim();
          if (search) {
            payments = payments.filter(p =>
              p.reference.toLowerCase().includes(search) ||
              p.items.some(item =>
                item.registration.reference_code.toLowerCase().includes(search) ||
                (item.registration.paper && item.registration.paper.toLowerCase().includes(search))
              )
            );
          }

          // Type filter
          const types = this.urlState.types;
          if (types.length > 0) {
            payments = payments.filter(p => types.includes(p.type));
          }

          // Method filter
          const methods = this.urlState.methods;
          if (methods.length > 0) {
            payments = payments.filter(p => methods.includes(p.method));
          }

          // Sorting
          const sort = this.urlState.sort;
          const desc = sort.startsWith('-');
          const key = desc ? sort.slice(1) : sort;
          const col = this.columns.find(c => c.key === key);
          if (col?.sortValue) {
            payments = [...payments].sort((a, b) => {
              const av = col.sortValue(a);
              const bv = col.sortValue(b);
              let cmp = 0;
              if (av < bv) cmp = -1;
              else if (av > bv) cmp = 1;
              return desc ? -cmp : cmp;
            });
          }

          return payments;
        },

        toggleSort(key) {
          const current = this.urlState.sort;
          if (current === key) {
            this.urlState.sort = '-' + key;
          } else {
            this.urlState.sort = key;
          }
        },

        sortIcon(key) {
          const current = this.urlState.sort;
          if (current === key) return 'bi-sort-down-alt';
          if (current === '-' + key) return 'bi-sort-up';
          return '';
        },

        // ---------------------------------------------------------------------------
        // Table Styling Helpers
        // ---------------------------------------------------------------------------

        thClass(col) {
          const classes = [];
          if (col.nowrap) classes.push('text-nowrap');
          if (col.sortValue) classes.push('user-select-none');
          if (col.center) classes.push('text-center');
          if (col.right) classes.push('text-end');
          if (col.sticky) classes.push('bg-body');
          return classes.join(' ');
        },

        thStyle(col) {
          const styles = [];
          if (col.width) {
            styles.push(`width: ${col.width}`, `min-width: ${col.width}`, `max-width: ${col.width}`);
          }
          if (col.flex) styles.push('width: 100%');
          if (col.sticky) {
            const left = col.stickyLeft || '0';
            styles.push('position: sticky', `left: ${left}`, 'z-index: 1');
            if (col.stickyBorder) styles.push('border-right: 1px solid var(--bs-border-color)');
          }
          return styles.join('; ');
        },

        tdClass(col) {
          const classes = [];
          if (col.nowrap) classes.push('text-nowrap');
          if (col.mono) classes.push('font-monospace');
          if (col.truncate) classes.push('text-truncate');
          if (col.center) classes.push('text-center');
          if (col.right) classes.push('text-end');
          if (col.sticky) classes.push('bg-body');
          return classes.join(' ');
        },

        tdStyle(col) {
          const styles = [];
          if (col.width) {
            styles.push(`width: ${col.width}`, `min-width: ${col.width}`, `max-width: ${col.width}`);
          }
          if (col.truncate) styles.push('max-width: 0');
          if (col.sticky) {
            const left = col.stickyLeft || '0';
            styles.push('position: sticky', `left: ${left}`);
            if (col.stickyBorder) styles.push('border-right: 1px solid var(--bs-border-color)');
          }
          return styles.join('; ');
        },

        // ---------------------------------------------------------------------------
        // Footer
        // ---------------------------------------------------------------------------

        get footerText() {
          const total = this.allPayments.length;
          const filtered = this.filteredPayments.length;
          return filtered === total ? `${total} payments` : `${filtered} of ${total} payments`;
        },

        // ---------------------------------------------------------------------------
        // Lifecycle
        // ---------------------------------------------------------------------------

        async init() {
          this.initUrlState();
          await this.fetchData();
        },

        async fetchData() {
          this.loading = true;
          this.error = null;

          try {
            const url = "{% url 'api-1.0.0:list-payments' params.conference_name %}";
            const {data} = await api.get(url, {params: {page_size: 1000}});
            this.allPayments = data.items;
          } catch (e) {
            this.error = e;
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
{% endblock %}
