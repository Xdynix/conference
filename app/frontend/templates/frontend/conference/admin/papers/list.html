{% extends "frontend/layouts/app.html" %}
{% load static %}

{% block title %}Papers - {% endblock %}

{% block content %}
  <div
    class="d-flex flex-column flex-grow-1 mx-n4 mb-n4"
    style="min-height: 0;"
    x-data="adminPaperList()"
    x-init="
      $store.sidebar.setActive('admin-papers');
      $store.breadcrumb.set([{label: 'Papers'}]);
    "
  >
    <div x-show="$store.conference.loading" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div x-show="!$store.conference.loading && !$store.conference.detail" x-cloak class="text-center py-5">
      <p class="text-muted mb-0">Conference not found.</p>
    </div>

    <template x-if="!$store.conference.loading && $store.conference.detail">
      <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        {# Header Actions #}
        <div class="d-flex justify-content-between align-items-center gap-2 pb-2 border-bottom">
          <div class="d-flex align-items-center gap-2">
            <a
              href="{% url 'frontend:admin-paper-new' conference_name=params.conference_name %}"
              class="btn btn-sm btn-outline-primary d-flex align-items-center gap-2"
            >
              <i class="bi-plus-lg"></i>
              New Paper
            </a>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button
              type="button"
              class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2"
              :disabled="loading"
              @click="fetchPapers()"
            >
              <span x-show="loading" class="spinner-border spinner-border-sm"></span>
              <i x-show="!loading" class="bi-arrow-clockwise"></i>
              Refresh
            </button>
          </div>
        </div>

        {# Main Content #}
        <div class="d-flex flex-grow-1 overflow-hidden">
          {# Paper Table #}
          <div class="flex-grow-1 overflow-auto">
            <div x-show="loading" class="text-center py-5">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>

            <div x-show="!loading && error" x-cloak class="text-center py-5">
              <p class="text-muted mb-0">Failed to load papers.</p>
            </div>

            <table x-show="!loading && !error" x-cloak class="table table-striped table-hover">
              <thead class="bg-body" style="position: sticky; top: 0; z-index: 1;">
              <tr>
                <template x-for="col in visibleColumns" :key="col.key">
                  <th
                    :class="thClass(col)"
                    :style="thStyle(col)"
                    @click="col.sortValue && toggleSort(col.key)"
                    :role="col.sortValue ? 'button' : null"
                  >
                    <span x-text="col.label"></span>
                    <i :class="sortIcon(col.key)" class="ms-1"></i>
                  </th>
                </template>
              </tr>
              </thead>
              <tbody>
              <template x-for="paper in filteredPapers" :key="paper.uid">
                <tr>
                  <template x-for="col in visibleColumns" :key="col.key">
                    <td
                      :class="tdClass(col)"
                      :style="tdStyle(col)"
                      :title="col.tooltip ? col.tooltip(paper) : null"
                    >
                      <template x-if="col.link && col.link(paper)">
                        <a
                          :href="col.link(paper)"
                          :class="col.muted?.(paper) && 'text-muted'"
                          target="_blank"
                          x-text="col.value(paper)"
                        ></a>
                      </template>
                      <template x-if="!(col.link && col.link(paper)) && col.badge">
                        <span class="badge" :class="col.badge(paper)" x-text="col.value(paper)"></span>
                      </template>
                      <template x-if="!(col.link && col.link(paper)) && !col.badge && col.icon && col.icon(paper)">
                        <i :class="col.icon(paper)"></i>
                      </template>
                      <template x-if="!(col.link && col.link(paper)) && !col.badge && !(col.icon && col.icon(paper))">
                        <span :class="col.muted?.(paper) && 'text-muted'" x-text="col.value(paper)"></span>
                      </template>
                    </td>
                  </template>
                </tr>
              </template>
              </tbody>
            </table>
          </div>

          {# Filter Sidebar #}
          <div class="d-flex flex-column border-start bg-body-tertiary" style="width: 280px;">
            {# Search field #}
            <div class="border-bottom position-relative">
              <i class="bi-search position-absolute top-50 translate-middle-y text-muted" style="left: 0.75rem;"></i>
              <input
                type="text"
                class="form-control border-0 rounded-0 ps-5"
                placeholder="Search code or title..."
                x-model="urlState.search"
              >
            </div>

            {# Filter sections #}
            <div class="flex-grow-1 overflow-auto">
              {# State filter #}
              <div class="border-bottom" x-data="{open: true}">
                <button
                  class="btn btn-link text-decoration-none text-body w-100 d-flex justify-content-between align-items-center px-3 py-2"
                  type="button"
                  @click="open = !open"
                >
                  <span class="fw-medium">State</span>
                  <i class="small" :class="open ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                </button>
                <template x-if="open">
                  <div class="px-3 pb-3">
                    <template x-for="state in stateOptions" :key="state.value">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          :id="'state-' + state.value"
                          :value="state.value"
                          :checked="urlState.states.includes(state.value)"
                          @change="toggleState(state.value)"
                        >
                        <label class="form-check-label" :for="'state-' + state.value" x-text="state.label"></label>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              {# Track filter #}
              <div class="border-bottom" x-data="{open: false}">
                <button
                  class="btn btn-link text-decoration-none text-body w-100 d-flex justify-content-between align-items-center px-3 py-2"
                  type="button"
                  @click="open = !open"
                >
                  <span class="fw-medium">Track</span>
                  <i class="small" :class="open ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                </button>
                <template x-if="open">
                  <div class="px-3 pb-3">
                    <template x-for="track in trackOptions" :key="track.uid">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          :id="'track-' + track.uid"
                          :value="track.uid"
                          :checked="urlState.tracks.includes(track.uid)"
                          @change="toggleTrack(track.uid)"
                        >
                        <label class="form-check-label" :for="'track-' + track.uid" x-text="track.display_name"></label>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              {# Announced filter #}
              <div class="border-bottom" x-data="{open: false}">
                <button
                  class="btn btn-link text-decoration-none text-body w-100 d-flex justify-content-between align-items-center px-3 py-2"
                  type="button"
                  @click="open = !open"
                >
                  <span class="fw-medium">Announced</span>
                  <i class="small" :class="open ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                </button>
                <template x-if="open">
                  <div class="px-3 pb-3">
                    <template x-for="opt in announcedOptions" :key="opt.value">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="announced"
                          :id="'announced-' + (opt.value || 'all')"
                          :value="opt.value"
                          :checked="urlState.announced === opt.value"
                          @change="urlState.announced = opt.value"
                        >
                        <label
                          class="form-check-label"
                          :for="'announced-' + (opt.value || 'all')"
                          x-text="opt.label"
                        ></label>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              {# Withdrawn filter #}
              <div class="border-bottom" x-data="{open: false}">
                <button
                  class="btn btn-link text-decoration-none text-body w-100 d-flex justify-content-between align-items-center px-3 py-2"
                  type="button"
                  @click="open = !open"
                >
                  <span class="fw-medium">Withdrawn</span>
                  <i class="small" :class="open ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                </button>
                <template x-if="open">
                  <div class="px-3 pb-3">
                    <template x-for="opt in withdrawnOptions" :key="opt.value">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="withdrawn"
                          :id="'withdrawn-' + (opt.value || 'all')"
                          :value="opt.value"
                          :checked="urlState.withdrawn === opt.value"
                          @change="urlState.withdrawn = opt.value"
                        >
                        <label
                          class="form-check-label"
                          :for="'withdrawn-' + (opt.value || 'all')"
                          x-text="opt.label"
                        ></label>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              {# Optional columns #}
              <div class="border-bottom" x-data="{open: false}">
                <button
                  class="btn btn-link text-decoration-none text-body w-100 d-flex justify-content-between align-items-center px-3 py-2"
                  type="button"
                  @click="open = !open"
                >
                  <span class="fw-medium">Columns</span>
                  <i class="small" :class="open ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                </button>
                <template x-if="open">
                  <div class="px-3 pb-3">
                    <template x-for="opt in optionalColumns" :key="opt.key">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          :id="'col-' + opt.key"
                          :checked="urlState.columns.includes(opt.key)"
                          @change="toggleColumn(opt.key)"
                        >
                        <label class="form-check-label" :for="'col-' + opt.key" x-text="opt.label"></label>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

            </div>
          </div>
        </div>

        {# Footer #}
        <div class="d-flex justify-content-between align-items-center px-4 pt-2 border-top">
          <span class="text-muted" x-text="footerText"></span>
        </div>
      </div>
    </template>
  </div>
{% endblock %}

{% block scripts %}
  {{ block.super }}
  <script src="{% static 'frontend/js/url-state.js' %}"></script>
  <script>
    // =============================================================================
    // URL State Schema Configuration
    // =============================================================================

    const adminPaperListSortOptions = [
      'code', '-code',
      'title', '-title',
      'track', '-track',
      'state', '-state',
      'announced', '-announced',
      'created', '-created',
      'reviewers', '-reviewers',
      'submitted', '-submitted',
      'score', '-score',
    ];

    const adminPaperListStateOptions = Object.values(APP.enums.PaperState)
      .filter(s => s && typeof s.value === 'string')
      .map(s => s.value);

    const adminPaperListColumnOptions = [
      'track',
      'created',
      'review-stats',
      'score',
    ];

    const adminPaperListSchema = {
      search: UrlState.types.string({default: ''}),
      sort: UrlState.types.oneOf(adminPaperListSortOptions, {default: 'code'}),
      states: UrlState.types.setOf(
        UrlState.types.oneOf(adminPaperListStateOptions, {default: ''}),
        {default: [], allowEmpty: true}
      ),
      tracks: UrlState.types.setOf(
        UrlState.types.string({default: ''}),
        {default: [], allowEmpty: true}
      ),
      announced: UrlState.types.oneOf(['', 'yes', 'no'], {default: ''}),
      withdrawn: UrlState.types.oneOf(['', 'yes', 'no'], {default: ''}),
      columns: UrlState.types.setOf(
        UrlState.types.oneOf(adminPaperListColumnOptions, {default: ''}),
        {default: ['track'], allowEmpty: true}
      ),
    };

    // =============================================================================
    // Alpine Component
    // =============================================================================

    function adminPaperList() {
      return {
        ...UrlState.use(adminPaperListSchema),

        // ---------------------------------------------------------------------------
        // State
        // ---------------------------------------------------------------------------

        allPapers: [],
        loading: true,
        error: null,

        // ---------------------------------------------------------------------------
        // Column Definitions
        // ---------------------------------------------------------------------------

        columns: [
          {
            key: 'code',
            label: 'Code',
            value: (p) => p?.code,
            link: (p) => p?.code ? APP.urls.pages.adminPaperDetail(APP.params.conference_name, p.code) : null,
            sortValue: (p) => p?.code,
            muted: (p) => !!p?.withdraw_time,
            nowrap: true,
            mono: true,
            sticky: true,
          },
          {
            key: 'title',
            label: 'Title',
            value: (p) => p?.title || 'Untitled',
            sortValue: (p) => (p?.title || '').toLowerCase(),
            tooltip: (p) => p?.title,
            muted: (p) => !!p?.withdraw_time,
            flex: true,
            truncate: true,
          },
          {
            key: 'track',
            label: 'Track',
            value: (p) => p?.track?.display_name || '',
            sortValue: (p) => p?.track?.display_name || '',
            muted: (p) => !!p?.withdraw_time,
            nowrap: true,
          },
          {
            key: 'state',
            label: 'State',
            value: (p) => {
              const label = enumLabel(APP.enums.PaperState, p?.state);
              return p?.withdraw_time ? `${label} (Withdrawn)` : label;
            },
            sortValue: (p) => p?.withdraw_time ? 'Withdrawn' : p?.state,
            badge: (p) => {
              if (!p) return 'text-bg-secondary';
              const classes = {
                [APP.enums.PaperState.DRAFT.value]: 'text-bg-secondary',
                [APP.enums.PaperState.SUBMITTED.value]: 'text-bg-primary',
                [APP.enums.PaperState.UNDER_REVIEW.value]: 'text-bg-info',
                [APP.enums.PaperState.ACCEPTED.value]: 'text-bg-success',
                [APP.enums.PaperState.ACCEPTED_REVISION_NEEDED.value]: 'text-bg-warning',
                [APP.enums.PaperState.REJECTED.value]: 'text-bg-danger',
              };
              const base = classes[p.state] || 'text-bg-secondary';
              return p.withdraw_time ? `${base} opacity-50` : base;
            },
            nowrap: true,
          },
          {
            key: 'announced',
            label: 'Announced',
            value: (p) => p?.announce_time ? 'Yes' : '',
            icon: (p) => p?.announce_time ? 'bi-check-lg text-success' : '',
            sortValue: (p) => p?.announce_time ? 1 : 0,
            nowrap: true,
            center: true,
          },
          {
            key: 'created',
            label: 'Created',
            value: (p) => p?.create_time ? formatDate(p.create_time) : '',
            sortValue: (p) => p?.create_time || '',
            nowrap: true,
          },
          {
            key: 'reviewers',
            label: 'Reviewers',
            value: (p) => {
              const stat = p?.review_stat;
              if (!stat) return '';
              return (stat.accepted_count || 0) + (stat.submitted_count || 0);
            },
            sortValue: (p) => {
              const stat = p?.review_stat;
              if (!stat) return 0;
              return (stat.accepted_count || 0) + (stat.submitted_count || 0);
            },
            nowrap: true,
            center: true,
          },
          {
            key: 'submitted',
            label: 'Submitted',
            value: (p) => p?.review_stat?.submitted_count ?? '',
            sortValue: (p) => p?.review_stat?.submitted_count ?? 0,
            nowrap: true,
            center: true,
          },
          {
            key: 'score',
            label: 'Score',
            value: (p) => {
              const summary = p?.recommendation_summary;
              const submitted = summary?.submitted_average;
              const withDraft = summary?.submitted_and_draft_average;
              if (!submitted && !withDraft) return '';
              if (!submitted && withDraft) return `(${withDraft.toFixed(1)})`;
              if (submitted === withDraft || !withDraft) return submitted.toFixed(1);
              return `${submitted.toFixed(1)} (${withDraft.toFixed(1)})`;
            },
            sortValue: (p) => p?.recommendation_summary?.submitted_average ?? 0,
            nowrap: true,
            center: true,
          },
        ],

        baseColumnKeys: ['code', 'title', 'state', 'announced'],

        optionalColumns: [
          {key: 'track', label: 'Track', columnKeys: ['track']},
          {key: 'created', label: 'Created', columnKeys: ['created']},
          {key: 'review-stats', label: 'Review Stats', columnKeys: ['reviewers', 'submitted']},
          {key: 'score', label: 'Score', columnKeys: ['score']},
        ],

        get visibleColumnKeys() {
          const keys = [...this.baseColumnKeys];
          for (const opt of this.optionalColumns) {
            if (this.urlState.columns.includes(opt.key)) {
              for (const colKey of opt.columnKeys) {
                const col = this.columns.find(c => c.key === colKey);
                if (col) {
                  const insertIdx = this.columns.indexOf(col);
                  const pos = keys.findIndex((k, i) =>
                    this.columns.findIndex(c => c.key === k) > insertIdx
                  );
                  if (pos === -1) {
                    keys.push(colKey);
                  } else {
                    keys.splice(pos, 0, colKey);
                  }
                }
              }
            }
          }
          return keys;
        },

        get visibleColumns() {
          return this.visibleColumnKeys.map(key => this.columns.find(c => c.key === key)).filter(Boolean);
        },

        toggleColumn(key) {
          const columns = this.urlState.columns;
          if (columns.includes(key)) {
            this.urlState.columns = columns.filter(k => k !== key);
          } else {
            this.urlState.columns = [...columns, key];
          }
        },

        // ---------------------------------------------------------------------------
        // Filter Options
        // ---------------------------------------------------------------------------

        get stateOptions() {
          return Object.values(APP.enums.PaperState)
            .filter(s => s && typeof s.value === 'string')
            .map(s => ({value: s.value, label: s.label}));
        },

        get trackOptions() {
          return this.$store.conference.detail?.tracks || [];
        },

        announcedOptions: [
          {value: '', label: 'All'},
          {value: 'yes', label: 'Yes'},
          {value: 'no', label: 'No'},
        ],

        withdrawnOptions: [
          {value: '', label: 'All'},
          {value: 'yes', label: 'Yes'},
          {value: 'no', label: 'No'},
        ],

        // ---------------------------------------------------------------------------
        // Filter Toggle Methods
        // ---------------------------------------------------------------------------

        toggleState(state) {
          const states = this.urlState.states;
          if (states.includes(state)) {
            this.urlState.states = states.filter(s => s !== state);
          } else {
            this.urlState.states = [...states, state];
          }
        },

        toggleTrack(uid) {
          const tracks = this.urlState.tracks;
          if (tracks.includes(uid)) {
            this.urlState.tracks = tracks.filter(t => t !== uid);
          } else {
            this.urlState.tracks = [...tracks, uid];
          }
        },

        // ---------------------------------------------------------------------------
        // Filtering and Sorting
        // ---------------------------------------------------------------------------

        get filteredPapers() {
          let papers = this.allPapers;

          // Text search
          const search = this.urlState.search.toLowerCase().trim();
          if (search) {
            papers = papers.filter(p =>
              p.code.toLowerCase().includes(search) ||
              (p.title && p.title.toLowerCase().includes(search))
            );
          }

          // State filter
          const states = this.urlState.states;
          if (states.length > 0) {
            papers = papers.filter(p => states.includes(p.state));
          }

          // Track filter
          const tracks = this.urlState.tracks;
          if (tracks.length > 0) {
            papers = papers.filter(p => tracks.includes(p.track?.uid));
          }

          // Announced filter
          const announced = this.urlState.announced;
          if (announced === 'yes') {
            papers = papers.filter(p => p.announce_time);
          } else if (announced === 'no') {
            papers = papers.filter(p => !p.announce_time);
          }

          // Withdrawn filter
          const withdrawn = this.urlState.withdrawn;
          if (withdrawn === 'yes') {
            papers = papers.filter(p => p.withdraw_time);
          } else if (withdrawn === 'no') {
            papers = papers.filter(p => !p.withdraw_time);
          }

          // Sorting
          const sort = this.urlState.sort;
          const desc = sort.startsWith('-');
          const key = desc ? sort.slice(1) : sort;
          const col = this.columns.find(c => c.key === key);
          if (col?.sortValue) {
            papers = [...papers].sort((a, b) => {
              const av = col.sortValue(a);
              const bv = col.sortValue(b);
              let cmp = 0;
              if (av < bv) cmp = -1;
              else if (av > bv) cmp = 1;
              return desc ? -cmp : cmp;
            });
          }

          return papers;
        },

        toggleSort(key) {
          const current = this.urlState.sort;
          if (current === key) {
            this.urlState.sort = '-' + key;
          } else {
            this.urlState.sort = key;
          }
        },

        sortIcon(key) {
          const current = this.urlState.sort;
          if (current === key) return 'bi-sort-down-alt';
          if (current === '-' + key) return 'bi-sort-up';
          return '';
        },

        // ---------------------------------------------------------------------------
        // Table Styling Helpers
        // ---------------------------------------------------------------------------

        thClass(col) {
          const classes = [];
          if (col.nowrap) classes.push('text-nowrap');
          if (col.sortValue) classes.push('user-select-none');
          if (col.center) classes.push('text-center');
          if (col.sticky) classes.push('bg-body');
          return classes.join(' ');
        },

        thStyle(col) {
          const styles = [];
          if (col.flex) styles.push('width: 100%');
          if (col.sticky) styles.push('position: sticky', 'left: 0', 'z-index: 1', 'border-right: 1px solid var(--bs-border-color)');
          return styles.join('; ');
        },

        tdClass(col) {
          const classes = [];
          if (col.nowrap) classes.push('text-nowrap');
          if (col.mono) classes.push('font-monospace');
          if (col.truncate) classes.push('text-truncate');
          if (col.center) classes.push('text-center');
          if (col.sticky) classes.push('bg-body');
          return classes.join(' ');
        },

        tdStyle(col) {
          const styles = [];
          if (col.truncate) styles.push('max-width: 0');
          if (col.sticky) styles.push('position: sticky', 'left: 0', 'border-right: 1px solid var(--bs-border-color)');
          return styles.join('; ');
        },

        // ---------------------------------------------------------------------------
        // Footer
        // ---------------------------------------------------------------------------

        get footerText() {
          const total = this.allPapers.length;
          const filtered = this.filteredPapers.length;
          if (filtered === total) {
            return `${total} papers`;
          }
          return `${filtered} of ${total} papers`;
        },

        // ---------------------------------------------------------------------------
        // Lifecycle
        // ---------------------------------------------------------------------------

        async init() {
          this.initUrlState();
          await this.fetchPapers();
        },

        async fetchPapers() {
          this.loading = true;
          this.error = null;

          try {
            const url = "{% url 'api-1.0.0:list-papers' params.conference_name %}";
            const {data} = await api.get(url, {params: {page_size: 1000}});
            this.allPapers = data.items;
          } catch (e) {
            this.error = e;
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
{% endblock %}
