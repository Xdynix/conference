<aside class="d-flex flex-column flex-shrink-0 border-end bg-body-tertiary" style="width: 250px;" x-data>
  <nav class="flex-grow-1 overflow-auto p-3">
    <ul class="nav nav-pills flex-column">
      <li class="nav-item">
        <a
          class="nav-link d-flex align-items-center gap-2"
          :class="{'active': $store.sidebar.active === 'home'}"
          href="{% url 'frontend:conference-home' conference_name=params.conference_name %}"
        >
          <i class="bi-house"></i>
          Home
        </a>
      </li>
    </ul>
    <div class="d-flex flex-column gap-2 my-3">
      <template x-if="$store.conference.detail?.tracks?.some(t => t.accepts_submissions)">
        <a
          class="btn btn-outline-primary d-flex align-items-center gap-2"
          href="{% url 'frontend:paper-new' conference_name=params.conference_name %}"
        >
          <i class="bi-plus-circle"></i>
          Submit Paper
        </a>
      </template>
      <template x-if="$store.conference.detail?.registration_enabled">
        <a
          class="btn btn-outline-primary d-flex align-items-center gap-2"
          href="{% url 'frontend:registration-new' conference_name=params.conference_name %}"
        >
          <i class="bi-plus-circle"></i>
          Register
        </a>
      </template>
    </div>
    <ul class="nav nav-pills flex-column">
      <li class="nav-item">
        <a
          class="nav-link d-flex align-items-center gap-2"
          :class="{'active': $store.sidebar.active === 'my-papers'}"
          href="{% url 'frontend:paper-list' conference_name=params.conference_name %}"
        >
          <i class="bi-file-earmark-text"></i>
          My Papers
        </a>
      </li>
      <li
        class="nav-item"
        x-show="$store.conference.detail?.registration_enabled || $store.conference.profile?.context?.has_registrations"
        x-cloak
      >
        <a
          class="nav-link d-flex align-items-center gap-2"
          :class="{'active': $store.sidebar.active === 'my-registrations'}"
          href="{% url 'frontend:registration-list' conference_name=params.conference_name %}"
        >
          <i class="bi-ticket-perforated"></i>
          My Registrations
        </a>
      </li>
      <li class="nav-item" x-show="$store.permissions.canReview" x-cloak>
        <a
          class="nav-link d-flex align-items-center gap-2"
          :class="{'active': $store.sidebar.active === 'my-reviews'}"
          href="{% url 'frontend:review-list' conference_name=params.conference_name %}"
        >
          <i class="bi-pencil-square"></i>
          My Reviews
          <span
            class="badge text-bg-danger rounded-pill"
            x-show="$store.conference.profile?.context?.actionable_review_count > 0"
            x-text="$store.conference.profile?.context?.actionable_review_count"
            x-cloak
          ></span>
        </a>
      </li>
      <li class="nav-item" x-show="$store.permissions.canReview" x-cloak>
        <a
          class="nav-link d-flex align-items-center gap-2"
          :class="{'active': $store.sidebar.active === 'review-preferences'}"
          href="{% url 'frontend:review-preferences' conference_name=params.conference_name %}"
        >
          <i class="bi-sliders"></i>
          Review Preferences
        </a>
      </li>
    </ul>
    <template x-if="$store.permissions.hasAdminRole">
      <div>
        <hr class="my-3">
        <ul class="nav nav-pills flex-column">
          <li class="nav-item">
            <a
              class="nav-link d-flex align-items-center gap-2"
              :class="{'active': $store.sidebar.active === 'admin-papers'}"
              href="{% url 'frontend:admin-paper-list' conference_name=params.conference_name %}"
            >
              <i class="bi-folder"></i>
              Papers
            </a>
          </li>
          <li class="nav-item" x-show="$store.permissions.isConferenceAdmin" x-cloak>
            <a
              class="nav-link d-flex align-items-center gap-2"
              :class="{'active': $store.sidebar.active === 'admin-registrations'}"
              href="{% url 'frontend:admin-registration-list' conference_name=params.conference_name %}"
            >
              <i class="bi-people"></i>
              Registrations
            </a>
          </li>
          {# TODO: Add href when Payments page is implemented #}
          <li class="nav-item" x-show="$store.permissions.isConferenceAdmin" x-cloak>
            <a
              class="nav-link d-flex align-items-center gap-2"
              :class="{'active': $store.sidebar.active === 'admin-payments'}"
              href="#"
            >
              <i class="bi-credit-card"></i>
              Payments
            </a>
          </li>
          {# TODO: Add href when Members page is implemented #}
          <li class="nav-item">
            <a
              class="nav-link d-flex align-items-center gap-2"
              :class="{'active': $store.sidebar.active === 'admin-members'}"
              href="#"
            >
              <i class="bi-person-badge"></i>
              Members
            </a>
          </li>
        </ul>
      </div>
    </template>
    <template x-if="$store.permissions.isChairRole">
      <div>
        <hr class="my-3">
        <ul class="nav nav-pills flex-column">
          <li class="nav-item">
            <a
              class="nav-link d-flex align-items-center gap-2"
              :class="{'active': $store.sidebar.active === 'admin-settings'}"
              href="{% url 'frontend:admin-settings' conference_name=params.conference_name %}"
            >
              <i class="bi-gear"></i>
              Settings
            </a>
          </li>
        </ul>
      </div>
    </template>
  </nav>
  <template x-if="$store.session.user?.is_superuser">
    <div class="p-3 border-top d-flex gap-2">
      <a
        href="{% url 'api-1.0.0:openapi-view' %}"
        class="btn btn-sm btn-secondary d-flex align-items-center gap-1"
        title="API Docs"
      >
        <i class="bi-file-code"></i>
        API
      </a>
      <a
        href="{% url 'admin:index' %}"
        class="btn btn-sm btn-secondary d-flex align-items-center gap-1"
        title="Django Admin"
      >
        <i class="bi-shield-lock"></i>
        Admin
      </a>
    </div>
  </template>
</aside>
