<aside
  class="d-flex flex-column flex-shrink-0 border-end bg-body-tertiary"
  style="width: 250px;"
  x-data="sidebar()"
>
  <nav class="flex-grow-1 overflow-auto p-3">
    <ul class="nav nav-pills flex-column">
      <li class="nav-item">
        <a
          class="nav-link d-flex align-items-center gap-2"
          :class="{'active': $store.sidebar?.active === 'home'}"
          href="{% url 'frontend:conference-home' conference_name=params.conference_name %}"
        >
          <i class="bi-house"></i>
          Home
        </a>
      </li>
    </ul>
    <a
      class="btn btn-outline-primary d-flex align-items-center gap-2 my-3"
      href="{% url 'frontend:paper-new' conference_name=params.conference_name %}"
    >
      <i class="bi-plus-circle"></i>
      Submit Paper
    </a>
    <ul class="nav nav-pills flex-column">
      <li class="nav-item">
        <a
          class="nav-link d-flex align-items-center gap-2"
          :class="{'active': $store.sidebar?.active === 'my-papers'}"
          href="{% url 'frontend:paper-list' conference_name=params.conference_name %}"
        >
          <i class="bi-file-earmark-text"></i>
          My Papers
        </a>
      </li>
      {# TODO: Add href when My Reviews page is implemented #}
      <li class="nav-item" x-show="canReview" x-cloak>
        <a
          class="nav-link d-flex align-items-center gap-2"
          :class="{'active': $store.sidebar?.active === 'my-reviews'}"
          href="#"
        >
          <i class="bi-pencil-square"></i>
          My Reviews
        </a>
      </li>
    </ul>
    <template x-if="hasAdminRole">
      <div>
        <hr class="my-3">
        <ul class="nav nav-pills flex-column">
          {# TODO: Add href when Papers management page is implemented #}
          <li class="nav-item">
            <a
              class="nav-link d-flex align-items-center gap-2"
              :class="{'active': $store.sidebar?.active === 'papers'}"
              href="#"
            >
              <i class="bi-folder"></i>
              Papers
            </a>
          </li>
          {# TODO: Add href when Reviews management page is implemented #}
          <li class="nav-item">
            <a
              class="nav-link d-flex align-items-center gap-2"
              :class="{'active': $store.sidebar?.active === 'reviews'}"
              href="#"
            >
              <i class="bi-clipboard-check"></i>
              Reviews
            </a>
          </li>
        </ul>
      </div>
    </template>
  </nav>
  <template x-if="$store.session?.user?.is_superuser">
    <div class="p-3 border-top d-flex gap-2">
      <a
        href="{% url 'api-1.0.0:openapi-view' %}"
        class="btn btn-sm btn-secondary d-flex align-items-center gap-1"
        title="API Docs"
      >
        <i class="bi-file-code"></i>
        API
      </a>
      <a
        href="{% url 'admin:index' %}"
        class="btn btn-sm btn-secondary d-flex align-items-center gap-1"
        title="Django Admin"
      >
        <i class="bi-gear"></i>
        Admin
      </a>
    </div>
  </template>
</aside>
<script>
  function sidebar() {
    const enums = APP.enums;
    return {
      get canReview() {
        const user = this.$store.session?.user;
        const profile = this.$store.conference?.profile;

        if (user?.is_superuser) return true;

        if (user?.roles?.includes(enums.GlobalRole.ADMIN.value)) return true;

        const confReviewers = enums.ConferenceRole._collections.reviewers;
        if (profile?.conference_roles?.some(r => confReviewers.includes(r))) return true;

        const trackReviewers = enums.TrackRole._collections.reviewers;
        return !!profile?.track_roles?.some(tr => trackReviewers.includes(tr.role));
      },

      get hasAdminRole() {
        const user = this.$store.session?.user;
        const profile = this.$store.conference?.profile;

        if (user?.is_superuser) return true;

        if (user?.roles?.includes(enums.GlobalRole.ADMIN.value)) return true;

        const confAdmins = enums.ConferenceRole._collections.admins;
        if (profile?.conference_roles?.some(r => confAdmins.includes(r))) return true;

        const trackAdmins = enums.TrackRole._collections.admins;
        return !!profile?.track_roles?.some(tr => trackAdmins.includes(tr.role));
      },
    };
  }
</script>
