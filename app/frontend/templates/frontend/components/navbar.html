{% load frontend_tags %}
{% branding as brand %}
<template x-data="impersonationBanner()" x-if="$store.session.impersonating">
  <div
    class="bg-warning text-dark py-2 px-3 d-flex align-items-center justify-content-center gap-2 small"
  >
    <i class="bi-exclamation-triangle-fill"></i>
    <span>
      Viewing as
      <strong x-text="$store.session.user?.username"></strong>
    </span>
    <button
      type="button"
      class="btn btn-dark btn-sm py-0 px-2"
      :disabled="loading"
      @click="revert()"
    >
      <span
        x-show="loading"
        class="spinner-border spinner-border-sm me-1"
        style="width: 0.75rem; height: 0.75rem;"
      ></span>
      Revert
    </button>
  </div>
</template>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom py-0 sticky-top">
  <div class="container-fluid ps-0">
    <div class="navbar-brand mb-0 py-0 d-flex align-items-center gap-2">
      {% if brand.logo_url %}
        <a
          href="{{ brand.parent_url|default:'/' }}"
          class="d-flex align-items-center py-2 px-3"
        >
          <img
            src="{{ brand.logo_url }}"
            alt="{{ brand.logo_alt|default:'Logo' }}"
            {% if brand.logo_height %}
            height="{{ brand.logo_height }}"
            {% else %}
            style="height: 1.5em"
            {% endif %}
          >
        </a>
      {% endif %}
      <span
        class="{% if not brand.logo_url %}ps-3 py-2{% endif %}"
      >Paper Submission</span>
      <span
        x-data
        x-cloak
        x-show="$store.conference?.detail"
        class="text-body-secondary"
      >
        <span class="mx-2">&middot;</span>
        <a
          :href="APP.urls.pages.conferenceHome(APP.params.conference_name)"
          class="text-body-secondary text-decoration-none"
          x-text="$store.conference?.detail?.name"
        ></a>
      </span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <div class="dropdown" x-data="themeSwitcher()">
        <button
          class="btn btn-link nav-link dropdown-toggle px-2"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          aria-label="Theme"
        ><i x-cloak :class="icon"></i></button>
        <ul class="dropdown-menu dropdown-menu-end">
          <template x-for="opt in options" :key="opt.value">
            <li>
              <button
                class="dropdown-item d-flex align-items-center"
                :class="value === opt.value && 'active'"
                type="button"
                @click="set(opt.value)"
              >
                <i class="me-2" :class="opt.icon"></i>
                <span x-text="opt.label"></span>
                <i
                  class="bi-check2 ms-auto"
                  :class="value !== opt.value && 'invisible'"
                ></i>
              </button>
            </li>
          </template>
        </ul>
      </div>

      <div
        x-data="impersonationControl()"
        x-cloak
        x-show="$store.session.user?.is_superuser"
        class="dropdown"
      >
        <button
          class="btn btn-link nav-link px-2"
          type="button"
          data-bs-toggle="dropdown"
          data-bs-auto-close="outside"
          aria-expanded="false"
          aria-label="Impersonate user"
        ><i class="bi-person-badge"></i></button>
        <div class="dropdown-menu dropdown-menu-end p-3" style="min-width: 400px;">
          <div class="mb-2 text-muted small">Impersonate user</div>
          <select
            x-ref="userSelect"
            class="form-select"
            placeholder="Search users..."
          ></select>
          <button
            type="button"
            class="btn btn-warning btn-sm w-100 mt-2"
            :disabled="!selectedUser || loading"
            @click="impersonate()"
          >
            <span
              x-show="loading"
              class="spinner-border spinner-border-sm me-1"
            ></span>
            Impersonate
          </button>
          <div
            x-show="error"
            x-text="error"
            class="text-danger small mt-2"
          ></div>
        </div>
      </div>

      <div x-data="userMenu()" x-cloak>
        <template x-if="$store.session.user">
          <div class="dropdown">
            <button
              class="btn btn-secondary dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="bi-person-circle me-1"></i>
              <span x-text="displayName()"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="{% url 'frontend:account' %}">Account</a>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <button class="dropdown-item" type="button" @click="logout()">
                  Log out
                </button>
              </li>
            </ul>
          </div>
        </template>

        <template x-if="!$store.session.user">
          <div class="d-flex gap-2">
            <a
              :href="signUpUrl()"
              class="btn btn-outline-primary btn-sm"
            >
              Sign up
            </a>
            <a :href="logInUrl()" class="btn btn-primary btn-sm">
              Log in
            </a>
          </div>
        </template>
      </div>
    </div>
  </div>
</nav>

<script>
  function themeSwitcher() {
    const options = [
      {value: "light", label: "Light", icon: "bi-sun-fill"},
      {value: "dark", label: "Dark", icon: "bi-moon-stars-fill"},
      {value: "auto", label: "Auto", icon: "bi-circle-half"},
    ];
    const iconMap = Object.fromEntries(options.map((o) => [o.value, o.icon]));

    return {
      options,
      value: localStorage.getItem("theme") || "auto",

      get icon() {
        return iconMap[this.value];
      },

      init() {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
          if (this.value === "auto") {
            this.apply();
          }
        });
      },

      set(value) {
        this.value = value;
        localStorage.setItem("theme", value);
        this.apply();
      },

      apply() {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.bsTheme =
          this.value === "auto" ? (prefersDark ? "dark" : "light") : this.value;
      },
    };
  }

  function userMenu() {
    function getNextParam() {
      const params = new URLSearchParams(window.location.search);
      const existing = params.get("{% redirect_field_name %}");
      if (existing) return existing;

      return window.location.pathname + window.location.search;
    }

    function buildAuthUrl(base) {
      const next = getNextParam();
      return `${base}?{% redirect_field_name %}=${encodeURIComponent(next)}`;
    }

    return {
      displayName() {
        const user = this.$store.session.user;
        if (!user) return "";
        const profile = user.profile;
        if (profile?.given_name || profile?.family_name) {
          return [profile.given_name, profile.family_name].filter(Boolean).join(" ");
        }
        return user.username;
      },

      signUpUrl() {
        return buildAuthUrl("{% url 'frontend:signup' %}");
      },

      logInUrl() {
        return buildAuthUrl("{% url 'frontend:login' %}");
      },

      logout() {
        this.$store.session.logout();
      },
    };
  }

  function impersonationBanner() {
    return {
      loading: false,

      async revert() {
        if (this.loading) return;
        this.loading = true;

        try {
          const {data} = await api.post(APP.urls.session.revert);
          this.$store.session.update(data);
          window.location.reload();
        } catch {
          this.loading = false;
        }
      },
    };
  }

  function impersonationControl() {
    return {
      selectedUser: null,
      loading: false,
      error: null,
      _ts: null,

      init() {
        this._ts = new TomSelect(this.$refs.userSelect, {
          valueField: "username",
          labelField: "username",
          placeholder: "Search users...",
          loadThrottle: 300,
          score: () => () => 1,
          load: async (query, callback) => {
            if (!query.length) return callback();
            try {
              const {data} = await api.get(APP.urls.users.list, {
                params: {search: query, page_size: 10},
              });
              callback(data.items.filter((u) => !u.is_superuser));
            } catch {
              callback();
            }
          },
          render: {
            option: (data, escape) => {
              return `<div>
                <div>${escape(data.username)}</div>
                <div class="text-muted small">${escape(data.email || "")}</div>
              </div>`;
            },
            item: (data, escape) => {
              return `<div>${escape(data.username)}</div>`;
            },
          },
          onChange: (value) => {
            this.selectedUser = value || null;
            this.error = null;
          },
        });
      },

      async impersonate() {
        if (this.loading || !this.selectedUser) return;
        this.loading = true;
        this.error = null;

        try {
          const {data} = await api.post(APP.urls.session.assume, {
            impersonated: this.selectedUser
          });
          this.$store.session.update(data);
          this._ts.clear();
          window.location.reload();
        } catch (err) {
          this.error = err.response?.data?.message || "Failed to impersonate user.";
        } finally {
          this.loading = false;
        }
      },
    };
  }
</script>
