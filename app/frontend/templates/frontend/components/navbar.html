{% load frontend_tags %}
{% branding as brand %}
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom py-0 sticky-top">
  <div class="container-fluid ps-0">
    <div class="navbar-brand mb-0 py-0 d-flex align-items-center gap-2">
      {% if brand.logo_url %}
        <a
          href="{{ brand.parent_url|default:'/' }}"
          class="d-flex align-items-center py-2 px-3"
        >
          <img
            src="{{ brand.logo_url }}"
            alt="{{ brand.logo_alt|default:'Logo' }}"
            {% if brand.logo_height %}
            height="{{ brand.logo_height }}"
            {% else %}
            style="height: 1.5em"
            {% endif %}
          >
        </a>
      {% endif %}
      <span
        class="{% if not brand.logo_url %}ps-3 py-2{% endif %}"
      >Paper Submission</span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <div class="dropdown" x-data="themeSwitcher()">
        <button
          class="btn btn-link nav-link dropdown-toggle px-2"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          aria-label="Theme"
        ><i x-cloak :class="icon"></i></button>
        <ul class="dropdown-menu dropdown-menu-end">
          <template x-for="opt in options" :key="opt.value">
            <li>
              <button
                class="dropdown-item d-flex align-items-center"
                :class="value === opt.value && 'active'"
                type="button"
                @click="set(opt.value)"
              >
                <i class="me-2" :class="opt.icon"></i>
                <span x-text="opt.label"></span>
                <i
                  class="bi-check2 ms-auto"
                  :class="value !== opt.value && 'invisible'"
                ></i>
              </button>
            </li>
          </template>
        </ul>
      </div>

      <div x-data="userMenu()" x-cloak>
        <template x-if="$store.session.user">
          <div class="dropdown">
            <button
              class="btn btn-secondary dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="bi-person-circle me-1"></i>
              <span x-text="displayName()"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="{% url 'frontend:account' %}">Account</a>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <button class="dropdown-item" type="button" @click="logout()">
                  Log out
                </button>
              </li>
            </ul>
          </div>
        </template>

        <template x-if="!$store.session.user">
          <div class="d-flex gap-2">
            <a
              href="{% url 'frontend:signup' %}"
              class="btn btn-outline-primary btn-sm"
            >
              Sign up
            </a>
            <a href="{% url 'frontend:login' %}" class="btn btn-primary btn-sm">
              Log in
            </a>
          </div>
        </template>
      </div>
    </div>
  </div>
</nav>

<script>
  function themeSwitcher() {
    const options = [
      {value: "light", label: "Light", icon: "bi-sun-fill"},
      {value: "dark", label: "Dark", icon: "bi-moon-stars-fill"},
      {value: "auto", label: "Auto", icon: "bi-circle-half"},
    ];
    const iconMap = Object.fromEntries(options.map((o) => [o.value, o.icon]));

    return {
      options,
      value: localStorage.getItem("theme") || "auto",

      get icon() {
        return iconMap[this.value];
      },

      init() {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
          if (this.value === "auto") {
            this.apply();
          }
        });
      },

      set(value) {
        this.value = value;
        localStorage.setItem("theme", value);
        this.apply();
      },

      apply() {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.bsTheme =
          this.value === "auto" ? (prefersDark ? "dark" : "light") : this.value;
      },
    };
  }

  function userMenu() {
    return {
      displayName() {
        const user = this.$store.session.user;
        if (!user) return "";
        const profile = user.profile;
        if (profile?.given_name || profile?.family_name) {
          return [profile.given_name, profile.family_name].filter(Boolean).join(" ");
        }
        return user.username;
      },

      logout() {
        this.$store.session.logout();
      },
    };
  }
</script>
