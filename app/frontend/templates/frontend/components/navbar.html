<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom py-0 sticky-top">
  <div class="container-fluid ps-0">
    <div class="navbar-brand mb-0 py-0 d-flex align-items-center gap-2">
      {% if settings.BRANDING.logo_url %}
        <a
          href="{{ settings.BRANDING.parent_url|default:'/' }}"
          class="d-flex align-items-center py-2 px-3"
        >
          <img
            src="{{ settings.BRANDING.logo_url }}"
            alt="{{ settings.BRANDING.logo_alt|default:'Logo' }}"
            {% if settings.BRANDING.logo_height %}
            height="{{ settings.BRANDING.logo_height }}"
            {% else %}
            style="height: 1.5em"
            {% endif %}
          >
        </a>
      {% endif %}
      <span class="{% if not settings.BRANDING.logo_url %}ps-3 py-2{% endif %}">Paper Submission</span>
    </div>

    <div class="d-flex align-items-center gap-2" x-data="navbar()" x-cloak>
      <template x-if="$store.session.user">
        <div class="dropdown">
          <button
            class="btn btn-outline-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            x-text="displayName()"
          ></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <!-- TODO: link to profile page -->
              <a class="dropdown-item" href="#" @click.prevent>Profile</a>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <button class="dropdown-item" type="button" @click="logout()">
                Sign out
              </button>
            </li>
          </ul>
        </div>
      </template>

      <template x-if="!$store.session.user">
        <div class="d-flex gap-2">
          <!-- TODO: link to registration page -->
          <a href="#" class="btn btn-outline-secondary btn-sm" @click.prevent>
            Sign up
          </a>
          <!-- TODO: link to login page -->
          <a href="#" class="btn btn-primary btn-sm" @click.prevent>
            Log in
          </a>
        </div>
      </template>
    </div>
  </div>
</nav>

<script>
  function navbar() {
    return {
      displayName() {
        const user = this.$store.session.user;
        if (!user) return "";
        const profile = user.profile;
        if (profile?.given_name || profile?.family_name) {
          return [profile.given_name, profile.family_name].filter(Boolean).join(" ");
        }
        return user.username;
      },

      logout() {
        this.$store.session.logout();
      }
    };
  }
</script>
