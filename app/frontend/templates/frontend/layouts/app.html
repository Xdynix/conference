{% extends "frontend/layouts/base.html" %}

{% block body_class %}d-flex flex-column vh-100 overflow-hidden{% endblock %}

{% block body_wrapper %}
  {% include "frontend/components/navbar.html" %}
  <div class="d-flex flex-grow-1 overflow-hidden">
    {% include "frontend/components/sidebar.html" %}
    <main class="flex-grow-1 overflow-auto p-4">
      <nav x-data aria-label="breadcrumb" class="border-bottom pb-3 mb-3">
        <ol class="breadcrumb mb-0">
          <template x-for="(item, index) in $store.breadcrumb.items" :key="index">
            <li
              class="breadcrumb-item"
              :class="{ 'active': !item.url }"
              :aria-current="!item.url ? 'page' : null"
            >
              <a x-show="item.url" :href="item.url" x-text="item.label"></a>
              <span x-show="!item.url" x-text="item.label"></span>
            </li>
          </template>
        </ol>
      </nav>
      {% block content %}{% endblock %}
    </main>
  </div>
{% endblock %}
