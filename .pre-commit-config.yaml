# TODO: No CI/CD yet. Pre-commit hooks cover linting. Next steps to consider:
# - Add a pre-push hook to run tests before pushing.
# - Add a git post-receive hook on the server for auto-deploy (rebuild + restart).
# - Revisit full CI/CD if the team grows or deploys become frequent.
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [ commit-msg ]
        additional_dependencies:
          - '@commitlint/config-conventional'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: pretty-format-json
        args:
          - --autofix
          - --no-sort-keys
          - --indent
          - '2'
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args:
          - --config
          - pyproject.toml
          - --configPointer
          - /tool/markdownlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: uv-lock-check
        name: check UV lock file
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^pyproject.toml$
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [ python ]
      - id: django-migration
        name: check Django migrations
        entry: uv run manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
