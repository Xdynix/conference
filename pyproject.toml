[project]
name = "conference"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "apscheduler>=3.11.3",
    "django-cleanup>=9.0.0",
    "django-extensions>=4.1",
    "django-ipware>=7.0.1",
    "django-mailer>=2.3.2",
    "django-ninja>=1.6.2",
    "django-stubs-ext~=6.0.2",
    "django[argon2]~=6.0.0",
    "httpx>=0.28.1",
    "ipython>=9.16.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "magika>=1.0.3",
    "markdown-it-py[linkify]>=4.2.0",
    "nh3>=0.3.6",
    "orjson>=3.11.9",
    "pydantic[email]>=2.13.4",
    "python-decouple>=3.8",
    "python-ulid-django>=1.5.0",
    "python-ulid[pydantic]>=4.0.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "sentry-sdk>=2.66.1",
    "servestatic[brotli]>=4.3.1",
    "typst>=0.15.0",
]

[dependency-groups]
dev = [
    "hupper>=1.12.1",
    "pyopenssl>=26.4.0",
    "rust-just>=1.58.0",
    "werkzeug>=3.1.8",
]
lint = [
    "django-stubs[compatible-mypy]~=6.0.0",
    "mypy>=2.3,<2.4",
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
    "types-jsonschema>=4.26.0.20260518",
]
prod = [
    "granian>=2.8.1",
    "supervisor>=4.3.0 ; sys_platform != 'win32'",
]
test = [
    "faker>=40.36.0",
    "jsonschema>=4.26.0",
    "pypdf>=6.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.13.0",
    "pytest-env>=1.7.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
]

[tool.uv]
default-groups = "all"
preview-features = ["audit-command"]

[tool.ruff]
cache-dir = ".cache/ruff"
extend-exclude = ["scratch"]

[tool.ruff.lint]
# Without this, the G rules do not recognize loguru's imported logger.
logger-objects = ["loguru.logger"]
select = [
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "PGH", # pygrep-hooks
    "UP", # pyupgrade
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "DTZ", # flake8-datetimez
    "G", # flake8-logging-format
    "PT", # flake8-pytest-style
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "FURB", # refurb
    "RUF", # Ruff-specific rules
]
ignore = [
    # Conflict with the formatter.
    "W191", # tab-indentation
    "E111", # indentation-with-invalid-multiple
    "E114", # indentation-with-invalid-multiple-comment
    "E117", # over-indented
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = [
    "G004", # logging-f-string
]
"scripts/dev-setup.py" = [
    "S603", # subprocess-without-shell-equals-true
    "S607", # start-process-with-partial-path
]
"tests/**/*.py" = [
    "S101", # assert
    "S105", # hardcoded-password-string
]
"**/migrations/*.py" = [
    "E501", # line-too-long
    "RUF001", # ambiguous-unicode-character-string
    "RUF012", # mutable-class-default
]

[tool.mypy]
strict = true
cache_dir = ".cache/mypy"
exclude = ["^scratch/"]
mypy_path = "etc/stubs"
num_workers = 8
plugins = [
    "mypy_django_plugin.main",
]

[[tool.mypy.overrides]]
module = ["mailer.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "app.settings"

[tool.pytest]
strict = true
cache_dir = ".cache/pytest"
testpaths = ["tests", "app"]
addopts = [
    "--doctest-modules",
    "--import-mode", "importlib",
    "--cov-config", "pyproject.toml",
    "--cov-report", "term:skip-covered",
    "--cov-report", "html",
    "--cov-fail-under", "100",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "expect_audit_error: test intentionally triggers audit error logging",
]
DJANGO_SETTINGS_MODULE = "app.settings"
env = ["SENTRY_DSN="]

[tool.coverage.run]
branch = true
data_file = ".cache/coverage/data.db"
disable_warnings = ["no-data-collected"]
omit = [
    "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
    "app/frontend/templatetags/*",
    "app/patches.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@overload",
    "case _ as unreachable:",
]

[tool.coverage.html]
directory = "var/cov-report"

[tool.markdownlint]
default = true
MD007 = { indent = 4 }
MD013 = { line_length = 88, strict = true }
