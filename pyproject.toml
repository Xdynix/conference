[project]
name = "conference"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "apscheduler>=3.11.0",
    "django-extensions>=4.1",
    "django-ipware>=7.0.1",
    "django-mailer>=2.3.2",
    "django-ninja>=1.4.3",
    "django-stubs[compatible-mypy]~=5.2",
    "django[argon2]~=5.2",
    "httpx>=0.28.1",
    "ipython>=9.4.0",
    "loguru>=0.7.3",
    "orjson>=3.11.0",
    "pydantic[email]>=2.11.7",
    "pyjwt[crypto]>=2.10.1",
    "python-decouple>=3.8",
    "python-ulid-django>=1.2.1",
    "python-ulid[pydantic]>=3.0.0",
    "servestatic[brotli]>=3.1.0",
]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "hupper>=1.12.1",
    "pyopenssl>=25.1.0",
    "rust-just>=1.42.3",
    "werkzeug[watchdog]>=3.1.3",
]
lint = [
    "mypy~=1.17",
    "pre-commit>=4.2.0",
    "ruff>=0.12.4",
]
test = [
    "faker>=37.4.2",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.14.1",
    "pytest-randomly>=3.16.0",
    "respx>=0.22.0",
]

[tool.uv]
default-groups = "all"

[tool.ruff]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "PGH", # pygrep-hooks
    "UP", # pyupgrade
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "FURB", # refurb
    "RUF", # Ruff-specific rules
]
ignore = [
    # Suppressed by ruff formatter.
    "W191", # tab-indentation
    "E111", # indentation-with-invalid-multiple
    "E114", # indentation-with-invalid-multiple-comment
    "E117", # over-indented
]

[tool.ruff.lint.per-file-ignores]
"scripts/dev-setup.py" = [
    "S603", # subprocess-without-shell-equals-true
    "S607", # Starting a process with a partial executable path
]
"tests/**/*.py" = [
    "S101", # assert
    "S105", # hardcoded-password-string
]
"**/migrations/*.py" = [
    "RUF012", # mutable-class-default
]

[tool.mypy]
strict = true
cache_dir = ".cache/mypy"
mypy_path = "etc/stubs"
plugins = [
    "mypy_django_plugin.main",
]

[tool.django-stubs]
django_settings_module = "app.settings"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
addopts = [
    "--doctest-modules",
    "--import-mode", "importlib",
    "--cov-config", "pyproject.toml",
    "--cov-report", "term",
    "--cov-report", "html",
    "--cov-fail-under", "100",
]
filterwarnings = [
    "error",
    # https://github.com/vitalik/django-ninja/issues/1093  # TODO: Remove once fixed.
    "ignore:Support for class-based `config` is deprecated, use ConfigDict instead.:DeprecationWarning",
]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "app.settings"

[tool.coverage.run]
branch = true
data_file = ".cache/coverage/data.db"
disable_warnings = ["no-data-collected"]
omit = [
    "*/migrations/*",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@overload",
]

[tool.coverage.html]
directory = "var/cov-report"
